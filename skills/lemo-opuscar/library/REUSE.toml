# The rules in LICENSE, file by file, in the REUSE format (https://reuse.software/spec/).
# Check with `reuse lint`. When a file matches several tables, the last one wins: our code, then the docs,
# then the films and their pictures, then the pictures that show third-party material or Clawd, then the two
# contributed styles, then third-party material.
# Every table overrides what a file says about itself, so this file and LICENSE are the only rules.
version = 1
SPDX-PackageName = "Lemo-Opuscar"
SPDX-PackageSupplier = "Lemomo (LemoLab)"
SPDX-PackageDownloadLocation = "https://github.com/lemomo-ai/lemo-opuscar"

# 1. Code: everything of ours that no later table names (code, data, configuration, CREDITS, small assets)
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lemomo (LemoLab)"
SPDX-License-Identifier = "MIT"

# 2. Docs: every Markdown file, and the image-generation prompts
[[annotations]]
path = ["**.md", "styles/*/demo/prompts/**", "styles/manga-panels/demo/tools/style_suffix.txt",
        "styles/comic-history/demo/tools/sheets.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lemomo (LemoLab)"
SPDX-License-Identifier = "CC-BY-NC-4.0"

# 3. The demo films' subtitles, posters and stills, and the pictures made from the films for the README and the site
[[annotations]]
path = ["styles/*/*.srt", "styles/*/poster.jpg", "styles/*/demo/stills/**", "styleboard/img/**",
        "docs/**.jpg", "docs/**.jpeg", "docs/**.png", "docs/**.webp", "docs/**.gif", "docs/**.avif", "docs/**.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lemomo (LemoLab)"
SPDX-License-Identifier = "CC-BY-4.0"

