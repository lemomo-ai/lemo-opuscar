<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// 《一块纸》 One Piece of Paper (Comic History Cartoon demo): the whole 51 s film on one timeline.
// The film is a comic page of paper panels on a table; a page camera moves between the panels and pushes one up to full screen.
// Each panel is a scene drawn by code: paper puppets keyed from part sheets (tools/extract.py) on a map printed on paper.
const W = 1920, H = 1080, DUR = 51;   // the last shot holds 1 s longer for the credit (title card) at the end
// any stretch of the one timeline renders with ?from=A&to=B (e.g. video.mjs --q 'from=0&to=10'); the picture is never re-made for a cut
const QS = new URLSearchParams(location.search), FROM = +(QS.get('from') || 0), TO = +(QS.get('to') || DUR);
const CREDIT = 'LemoLab \u00D7 Claude Opus 5.5', STYLE_EN = 'Comic History Cartoon', STYLE_ZH = '搞笑历史卡通';
window.DUR = TO - FROM;
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');
let ctx = MAIN;   // the context the scene functions draw into (a panel canvas while a panel renders)

// ---------------------------------------------------------------- palette
const C = {
  paper: '#F1E8D2', ink: '#2B2219',
  fr: '#6E93D6', de: '#5D6672',
  grey: '#7A8390',       // a German patch: Prussian grey one step lighter than the printed country (new paper on old print)
  blue: '#5A80CC',       // a French patch: France's blue one step deeper (it must read on the printed blue)
  sea: '#A6CCD3', red: '#C8463A', brass: '#D9B158',
  caption: '#F5E9C4',    // narration caption boxes (subtitles)
  table: '#7B6A57',
};

// ---------------------------------------------------------------- small maths
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const EASE = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  o: u => 1 - Math.pow(1 - u, 3),
  i: u => u * u * u,
  back: u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  el: u => u >= 1 ? 1 : 1 - Math.exp(-5.5 * u) * Math.cos(u * Math.PI * 3.1),   // rivet spring: overshoot, settle
};
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) {
      const [t0, v0] = keys[i - 1], u = EASE[e || 'io'](clamp((t - t0) / Math.max(t1 - t0, 1e-6), 0, 1));

const wob = (t, t0, amp, f = 5, d = 7) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * d) * Math.sin(2 * Math.PI * f * (t - t0));
const hop = (t, t0, t1, h) => t > t0 && t < t1 ? -h * Math.sin(Math.PI * (t - t0) / (t1 - t0)) : 0;
const popIn = (t, t0, d = 0.17) => t < t0 ? 0 : t - t0 < d ? EASE.el((t - t0) / d) : 1;
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }

const D2R = Math.PI / 180;
const twos = t => Math.floor(t * 12 + 1e-6) / 12;          // puppets move on twos (12 drawings a second)
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const len = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const angOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);

// ---------------------------------------------------------------- the timeline (film seconds). VO starts match vo/dur.json; see DEMO.md, "Shots"
const T = {
  slap: 4.0,                               // 1871 the grey patch lands
  p1out: 10.0, p2in: 11.0,                 // pull back from panel 1, slide into panel 2
  stamp: 15.2,                             // DEUTSCH stamp on her card
  p3out: 16.2, p3in: 16.8,                 // whip down to panel 3 (1918)
  grab: 20.1, rip: 20.75, fling: 21.15, hit: 21.45, slap18: 22.6, bubble18: 22.9,
  p4out: 26.2, p4in: 26.9,                 // slide right into panel 4 (1940, dark)
  press40: 29.3, curl: 30.6,
  p5out: 33.4, p5in: 34.1,                 // drop to panel 5 (1944–45)
  pull: 35.0, letgo: 36.95, thunk: 37.7,
  tilt0: 38.0, tilt1: 39.4,                // crane down: the stack seen from the side
  gran: 39.6, kid: 39.95, hop0: 38.0, tap: 42.8, pin: 45.6,
  back0: 46.2, back1: 46.9, title: 47.0,   // pull back to the page; the title card lands
};
const SUBS = [   // narration captions: one Chinese line, one English line (also written to demo-full.srt by tools/srt.mjs)
  [0.15, 4.45, '1871 年，法国刚输掉一场战争。', '1871. France has just lost a war.'],
  [4.55, 9.6, '阿尔萨斯-洛林，从此归了新成立的德意志帝国。', 'Alsace-Lorraine now belongs to the new German Empire.'],
  [11.2, 16.1, '那里的人一步也没挪，变的是他们的证件。', 'The people there never moved an inch. Their papers did.'],
  [16.9, 23.4, '1918 年，德国输了下一场战争，法国又把它撕了回来。', 'In 1918, Germany lost the next war, and France tore it right back off.'],
  [27.0, 33.9, '1940 年，纳粹德国又把它夺走。没有条约，只靠武力。', 'In 1940, Nazi Germany took it again. No treaty this time. Just force.'],
  [34.2, 38.2, '到 1945 年，它又回到了法国。', 'By 1945, it was French again.'],
  [38.3, 41.28, '四层纸，一辈子。', 'Four layers. One lifetime.'],
  [41.3, 46.16, '她一辈子没搬过家，家却换了四次国家。', 'She never moved house. Her home switched countries four times.'],
  [46.18, 50.0, '今天，斯特拉斯堡是欧洲议会的所在地。', 'Today, Strasbourg hosts the European Parliament.'],
];
window.SUBS = SUBS;
const VO = [['v1', 0.15], ['v2', 4.55], ['v3', 11.2], ['v4', 16.9], ['v5', 27.0], ['v6', 34.2], ['v7', 38.3], ['v8', 41.3], ['v9', 46.18]];

// ---------------------------------------------------------------- projection (equirectangular, cos(lat0) aspect)
const LON0 = 6.9, LAT0 = 48.7, CX = 960, CY = 600, KS = 128;
const KX = KS * Math.cos(LAT0 * D2R);
const P = (lon, lat) => [CX + (lon - LON0) * KX, CY - (lat - LAT0) * KS];
function decode(topo) {
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map(a => { let x = 0, y = 0; return a.map(([dx, dy]) => { x += dx; y += dy; return [x * sx + tx, y * sy + ty]; }); });
  const ring = idx => { const pts = []; for (const i of idx) { const a = i < 0 ? arcs[~i].slice().reverse() : arcs[i]; pts.push(...(pts.length ? a.slice(1) : a)); } return pts; };
  const out = {};
  for (const g of topo.objects.countries.geometries) {
    const polys = g.type === 'Polygon' ? [g.arcs] : g.type === 'MultiPolygon' ? g.arcs : [];
    out[g.properties.name] = polys.map(p => p.map(ring));
  }
  return out;
}
function pathOf(polys, g) {
  g.beginPath();
  for (const poly of polys) for (const r of poly) {
    let any = false; for (const [lo, la] of r) { const [x, y] = P(lo, la); if (x > -900 && x < W + 900 && y > -900 && y < H + 900) { any = true; break; } }
    if (!any) continue;
    r.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
  }
}
// 1871 groups: modern borders stand in; inside this frame they match closely (the 1871 Alsace-Lorraine line is hand-traced, see CREDITS)
const GROUPS = [
  { fill: C.fr, members: ['France', 'Monaco'] },
  { fill: C.de, members: ['Germany', 'Poland'] },
  { fill: '#E2B85A', members: ['Austria', 'Hungary', 'Czechia', 'Slovakia', 'Slovenia', 'Croatia', 'Bosnia and Herz.'] },
  { fill: '#8DB56F', members: ['Italy', 'San Marino', 'Vatican'] },
  { fill: '#B9A27E', members: ['Lithuania', 'Belarus', 'Ukraine', 'Russia', 'Latvia', 'Moldova'] },
  { fill: '#C98A86', members: ['United Kingdom', 'Ireland', 'Isle of Man', 'Jersey', 'Guernsey'] },
  { fill: '#D99A5B', members: ['Spain', 'Andorra', 'Portugal'] },
  { fill: '#D9705F', members: ['Switzerland', 'Liechtenstein'] },
  { fill: '#E9CF83', members: ['Belgium'] },
  { fill: '#EA9C5C', members: ['Netherlands'] },
  { fill: '#AEBB8E', members: ['Luxembourg'] },
  { fill: '#C7867A', members: ['Denmark'] },
  { fill: '#D8C48E', members: ['Sweden', 'Norway'] },
  { fill: '#C99A6E', members: ['Serbia', 'Romania', 'Montenegro', 'Kosovo', 'Albania', 'Macedonia', 'Bulgaria'] },
];
const AL_LINE = [[5.89, 49.55], [5.98, 49.33], [5.96, 49.12], [6.12, 48.98], [6.42, 48.86], [6.68, 48.72], [6.93, 48.58],
  [7.08, 48.42], [7.12, 48.22], [7.02, 48.04], [6.93, 47.88], [7.05, 47.74], [7.13, 47.50]];
const AL_POLY = [...AL_LINE, [9.5, 47.4], [9.5, 49.7], [5.6, 49.7]];

let geo, idx, img = {}, paperTex, pagePat, tablePat;
let MAP71, MAPDE, MAPZ, MAPTALL;              // printed map baked at 1.25x (1871 labels / later labels) and a 2.3x close-up for 1940
const MS = 1.25, PR = 2.5;          // static map bake scale; patch bake scale (patches get close-ups)
let PATCH_C, PATCH = {};             // the ceded land's centre (world) and its paper patches

// ---------------------------------------------------------------- paper texture (generated)
function makePaper(w, h, seed) {
  const c = canvas(w, h), g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900 * w * h / (W * H); i++) {
    const x = r() * w, y = r() * h, rad = 20 + r() * 150, v = r() < .5 ? 0 : 255;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${v},${v},${v},${0.03 + r() * 0.03})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 6000 * w * h / (W * H); i++) {
    const x = r() * w, y = r() * h, a = r() * Math.PI * 2, l = 4 + r() * 20, v = r() < .55 ? 40 : 230;
    g.strokeStyle = `rgba(${v},${v},${v},${0.04 + r() * 0.07})`; g.lineWidth = 0.6 + r() * 0.9;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * .5, y + Math.sin(a + 1) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (r() - .5) * 22; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);

}
// Numbers rule: IM FELL only has old-style figures (its 1 reads as a small-cap I, its 7 drops below the line, its dash is a stub),
// so every run of digits (with – . between them) is set in Old Standard TT with lining figures, in the weight that matches the text
// around it: Bold beside KuaiLe and in the year tags, Italic beside FellIt, Regular beside Fell.
const NUM_RE = /\d+(?:[.–]\d+)*/g;
function numFont(base) {

function textRuns(text) { const out = []; let i = 0; for (const m of text.matchAll(NUM_RE)) { if (m.index > i) out.push([text.slice(i, m.index), 0]); out.push([m[0], 1]); i = m.index + m[0].length; } if (i < text.length) out.push([text.slice(i), 0]); return out; }

  const nf = numFont(base), w = measureMixed(g, text, base), a0 = g.textAlign;
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  g.textAlign = 'left';
  for (const [t, n] of textRuns(text)) { g.font = n ? nf : base; g.fillText(t, cx, y); cx += g.measureText(t).width; }
  g.font = base; g.textAlign = a0; return w;
}
function spacedLeft(g, text, x, y, sp) { const a = g.textAlign; g.textAlign = 'left'; let cx = x; for (const c of text) { g.fillText(c, cx, y); cx += g.measureText(c).width + sp; } g.textAlign = a; }
function spaced(g, text, x, y, sp) {   // letter-spaced text centred on x
  const ch = [...text], w = ch.map(c => g.measureText(c).width), tot = w.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = x - tot / 2; ch.forEach((c, i) => { g.fillText(c, cx, y); cx += w[i] + sp; });

}

// ---------------------------------------------------------------- the printed map (baked)
// labels: 'empire' (1871), 'germany' (later), or null (close-up); g is already transformed world → canvas
function drawMap(g, labels) {
  g.fillStyle = C.sea; g.fillRect(-2000, -2000, W + 4000, H + 4000);
  const all = [];
  for (const G of GROUPS) for (const m of G.members) if (geo[m]) all.push(...geo[m]);
  g.save(); g.lineJoin = 'round';
  for (let i = 6; i >= 1; i--) { pathOf(all, g); g.lineWidth = i * 9; g.strokeStyle = i % 2 ? '#97BEC6' : '#AACED4'; g.stroke(); }
  g.restore();
  g.save(); g.strokeStyle = 'rgba(40,70,90,.20)'; g.lineWidth = 1; g.setLineDash([2, 5]);
  for (let lon = -15; lon <= 30; lon += 5) { const [x0, y0] = P(lon, 60), [x1, y1] = P(lon, 40); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  for (let lat = 40; lat <= 60; lat += 5) { const [x0, y0] = P(-15, lat), [x1, y1] = P(30, lat); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  g.restore();
  for (const G of GROUPS) { pathOf(G.members.flatMap(m => geo[m] || []), g); g.fillStyle = G.fill; g.fill('evenodd'); }
  for (const G of GROUPS) {
    const polys = G.members.flatMap(m => geo[m] || []);
    g.save(); pathOf(polys, g); g.clip('evenodd'); pathOf(polys, g); g.lineWidth = 12; g.strokeStyle = 'rgba(255,248,230,.20)'; g.stroke(); g.restore();
  }
  g.save(); g.lineJoin = 'round';
  for (const G of GROUPS) for (const m of G.members) { if (!geo[m]) continue; pathOf(geo[m], g); g.lineWidth = 1.3; g.strokeStyle = 'rgba(55,40,30,.5)'; g.stroke(); }
  pathOf(all, g); g.lineWidth = 2.2; g.strokeStyle = 'rgba(40,55,70,.7)'; g.stroke();
  g.restore();

  g.fillStyle = 'rgba(43,34,25,.86)'; g.textBaseline = 'middle'; g.textAlign = 'left';
  const L = (t, lon, lat, size, sp, rot = 0) => { const [x, y] = P(lon, lat); g.save(); g.translate(x, y); g.rotate(rot * D2R); g.font = `${size}px FellSC`; spaced(g, t, 0, 0, sp); g.restore(); };

  L(labels === 'empire' ? 'german empire' : 'germany', 8.75, 50.9, 34, labels === 'empire' ? 8 : 12, -3);
  L('austria-hungary', 15.6, 47.35, 26, 5, -6);
  L('switzerland', 8.15, 46.72, 24, 3);
  L('italy', 11.9, 46.3, 26, 7, 4);
  L('belgium', 4.45, 50.45, 22, 4, -10);
  L('netherlands', 5.6, 52.45, 20, 3);

  { const [x, y] = P(3.0, 52.75); g.save(); g.translate(x, y); g.rotate(-14 * D2R); spaced(g, 'North Sea', 0, 0, 3); g.restore(); }
  { const cx = 1820, cy = 958; g.save(); g.translate(cx, cy); g.strokeStyle = C.ink; g.fillStyle = C.ink; g.lineWidth = 1.5;
    g.beginPath(); g.arc(0, 0, 34, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(0, 0, 29, 0, Math.PI * 2); g.lineWidth = .8; g.stroke(); g.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.beginPath(); g.moveTo(0, -48); g.lineTo(7, 0); g.lineTo(-7, 0); g.closePath(); i === 3 ? g.fill() : g.stroke(); }
    g.font = '22px FellSC'; g.textAlign = 'center'; g.fillText('n', 0, -62); g.restore(); }
  { const km = KS / 111.2, x0 = 1540, y0 = 1030, L100 = 100 * km; g.save(); g.fillStyle = C.ink; g.strokeStyle = C.ink; g.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) { const xa = x0 + i * L100 / 2; i % 2 ? g.strokeRect(xa, y0, L100 / 2, 7) : g.fillRect(xa, y0, L100 / 2, 7); }
    g.font = '17px OldStd'; g.textAlign = 'center'; g.textBaseline = 'bottom';
    [0, 100, 200].forEach((k, i) => g.fillText(String(k), x0 + i * L100, y0 - 5)); g.font = '18px Fell'; g.textAlign = 'left'; g.fillText('km', x0 + 2 * L100 + 14, y0 - 5); g.restore(); }
}
function bakeMap(labels) {

  g.setTransform(1, 0, 0, 1, 0, 0);

}
const Z40 = 2.3;   // the 1940 close-up: world → scene is (p − PATCH_C)·Z40 + (960, 560)
const TALL = { x0: -300, y0: -1600, w: 2520, h: 2900 };   // the crane shot sees far beyond the frame's map: a taller sheet, baked once
function bakeMapTall() {
  const c = canvas(TALL.w, TALL.h), g = c.getContext('2d');
  g.translate(-TALL.x0, -TALL.y0); drawMap(g, 'germany');
  g.setTransform(1, 0, 0, 1, 0, 0); const tex = makePaper(1200, 1200, 51);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.55; for (let y = 0; y < TALL.h; y += 1200) for (let x = 0; x < TALL.w; x += 1200) g.drawImage(tex, x, y); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  return c;
}
function bakeMapZoom() {
  const c = canvas(W, H), g = c.getContext('2d');
  g.translate(960, 560); g.scale(Z40, Z40); g.translate(-PATCH_C[0], -PATCH_C[1]); drawMap(g, null);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.6; g.drawImage(paperTex, -300, -200); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  return c;
}

// ---------------------------------------------------------------- paper patches (baked at PR around the ceded land)
let PB;   // patch bake window in world coords
function alPath(g) {
  pathOf(geo['France'], g); g.clip('evenodd');
  g.beginPath(); AL_POLY.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath();
}
function bakePatch(col, seed, labels) {
  const w = (PB.x1 - PB.x0) * PR, h = (PB.y1 - PB.y0) * PR, toW = g => g.setTransform(PR, 0, 0, PR, -PB.x0 * PR, -PB.y0 * PR);
  const shape = canvas(w, h), k = shape.getContext('2d');
