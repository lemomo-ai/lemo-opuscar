<!doctype html>
<html><head><meta charset="utf-8"><title>The Inverted Jenny</title>
<style>html,body{margin:0;background:#ECDFC2;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Vintage Engraving Collage · the whole film 《The Inverted Jenny 倒置的珍妮》 (52 s, one timeline; the last 2.45 s are the end-card credits).
// Parts live in parts/ (baked by src/bake.py + src/bake2.py); narration times and subtitles are in timeline.json (src/timeline.py).
// This file only does what happens on the cutting table: slide in, settle, flip, hinge, cut, drop shadow, paper thickness, plus the camera and transitions between the seven scenes.
// ?from=A&to=B cuts an excerpt: window.DUR = B − A, render(t) draws film time A + t.
const W = 1920, H = 1080;
const Q = new URLSearchParams(location.search);
let FILM = 50, FROM = +(Q.get('from') ?? 0), TO = +(Q.get('to') ?? FILM);
window.DUR = TO - FROM;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingQuality = 'high';

// ---------- Helpers ----------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const EASE = {
  lin: p => p, out: p => 1 - Math.pow(1 - p, 3), in: p => p * p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const s = 1.9; p -= 1; return p * p * ((s + 1) * p + s) + 1; }, hold: p => 0,
  expo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
};
function hash(a, b = 0) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const STEP = 1 / 12;                                   // paper pieces move on twos; the camera is smooth every frame
const stepT = t => Math.floor(t / STEP + 1e-6) * STEP;
const D2R = Math.PI / 180;
const PAL = { paper: '#ECDFC2', card: '#F6EEDB', ink: '#221C17', ochre: '#C65F3A', teal: '#2F7F7A', mustard: '#E1AB3B', red: '#C8463F', blue: '#2F5D8C' };
const EDGE = '#B49D78', BACK = '#E9DFC8', SHADOW = 'rgb(62,40,22)';

// ---------- Parts ----------
let M, TL, SP = {}, B = 1.5;
async function loadImg(src) { const im = new Image(); im.src = src; await im.decode(); return im; }
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function tinted(img, color, pad, blur) {
  const c = canvasOf(img.width + 2 * pad, img.height + 2 * pad), g = c.getContext('2d');
  const tmp = canvasOf(img.width, img.height), t = tmp.getContext('2d');
  t.drawImage(img, 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = color; t.fillRect(0, 0, img.width, img.height);
  if (blur) g.filter = `blur(${blur}px)`;
  g.drawImage(tmp, pad, pad); return c;
}
function backside(img) { const c = tinted(img, BACK, 0, 0), g = c.getContext('2d'); g.globalAlpha = 0.10; g.globalCompositeOperation = 'source-atop'; g.drawImage(img, 0, 0); return c; }
// one "paper": image + cut edge + two levels of shadow + paper back; k = pixels per world unit
function sprite(img, k, back = false) {
  const pad = Math.round(16 * k);
  return { img, k, pad, edge: tinted(img, EDGE, 0, 0), sh1: tinted(img, SHADOW, pad, 2.5 * k), sh2: tinted(img, SHADOW, pad, 9 * k), back: back ? backside(img) : null };
}
async function loadParts() {
  M = await (await fetch('parts/manifest.json')).json(); B = M._.B;
  TL = await (await fetch('timeline.json')).json(); FILM = TL.dur;
  if (!Q.get('to')) { TO = FILM; window.DUR = TO - FROM; }
  const raw = {};
  const names = Object.keys(M).filter(k => !k.startsWith('_') && k !== 'paper');
  await Promise.all(names.map(async n => { raw[n] = await loadImg('parts/' + n + '.png'); }));
  const plain = ['st_paper', 'st_red', 'st_blue', 'st_tint'];
  for (const n of names) {
    if (plain.includes(n) || n.startsWith('sub') || n.endsWith('_bg')) { SP[n] = { img: raw[n], k: M[n].k || B, m: M[n] }; continue; }
    SP[n] = sprite(raw[n], M[n].k || B, n.startsWith('w_') || n.startsWith('t_')); SP[n].m = M[n];
  }
  for (const n of names) if (n.startsWith('sub') || n.endsWith('_bg')) { SP[n] = sprite(raw[n], B); SP[n].m = M[n]; }
  SP.paper = { img: await loadImg('parts/paper.jpg'), m: M.paper };
  buildStamps();
}
// ---------- Stamps: overprinted live from paper, red plate, blue plate ----------
// oval frame (source-image coordinates): centre (610, 500), radii (420, 232)
const OVAL_SRC = [610, 500, 420, 232];
let STAMP = {};
function stampCanvas(widthPx, parts) {
  const P = M.st_paper, k = widthPx / P.w, c = canvasOf(widthPx, P.h * k), g = c.getContext('2d');
  const [ox, oy] = [(OVAL_SRC[0] * 2 - P.crop[0]) * k, (OVAL_SRC[1] * 2 - P.crop[1]) * k];
  for (const p of parts) {
    if (p === 'paper') { g.drawImage(SP.st_paper.img, 0, 0, c.width, c.height); continue; }
    const name = p.replace('_inv', ''), m = M[name], img = SP[name].img;
    g.save();
    if (p.endsWith('_inv')) { g.translate(ox, oy); g.rotate(Math.PI); g.translate(-ox, -oy); }
    g.drawImage(img, m.off[0] * k, m.off[1] * k, m.w * k, m.h * k); g.restore();
  }
  return c;
}
function buildStamps() {
  const P = M.st_paper;
  // large stamp (opening): paper + red frame + sky line (the plane is a separate cut-out that drops in)
  STAMP.big = sprite(stampCanvas(P.w, ['paper', 'st_red', 'st_tint']), P.w / 760);
  STAMP.bigW = 760;
  // small stamps: red and blue plates on the full sheet (transparent ground, printed onto the sheet paper)
  for (const [n, w] of [['L', 720], ['S', 150]]) {
    STAMP['red' + n] = stampCanvas(w, ['st_red']); STAMP['blue' + n] = stampCanvas(w, ['st_blue']); STAMP['blueInv' + n] = stampCanvas(w, ['st_blue_inv']);
  }
  STAMP.inv = sprite(stampCanvas(360, ['paper', 'st_red', 'st_blue_inv']), 360 / 92);    // a single Inverted Jenny, world width 92
  STAMP.invHero = sprite(stampCanvas(900, ['paper', 'st_red', 'st_blue_inv']), 900 / 150);
}

// ---------- Drawing a paper piece: shadow → cut edge → front or paper back ----------
function drawSprite(S, ax, ay, lx, ly, r, z, sx = 1, s = 1, alpha = 1) {
  const img = S.img, w = img.width / S.k, h = img.height / S.k, pad = (S.pad || 0) / S.k;
  const flipW = Math.abs(sx) < 0.04 ? 0.04 * Math.sign(sx || 1) : sx;
  const place = (dx, dy) => { ctx.save(); ctx.translate(ax + dx, ay + dy); ctx.rotate(r * D2R); ctx.scale(flipW * s, s); };
  if (S.sh1) {
    const zz = Math.max(0, z), off = [3 + 4.2 * zz, 4 + 5.4 * zz], soft = clamp(zz / 2.2, 0, 1);
    const sa = alpha * (0.30 - 0.035 * Math.min(zz, 4));
    place(off[0], off[1]);
    if (soft < 1) { ctx.globalAlpha = sa * (1 - soft); ctx.drawImage(S.sh1, -lx - pad, -ly - pad, w + 2 * pad, h + 2 * pad); }
    if (soft > 0) { ctx.globalAlpha = sa * soft; ctx.drawImage(S.sh2, -lx - pad, -ly - pad, w + 2 * pad, h + 2 * pad); }
    ctx.restore();
    const side = Math.sqrt(Math.max(0, 1 - sx * sx));
    place(0.9 + 2.4 * side * Math.sign(sx || 1), 1.2); ctx.globalAlpha = alpha; ctx.drawImage(S.edge, -lx, -ly, w, h); ctx.restore();
  }
  place(0, 0); ctx.globalAlpha = alpha;
  ctx.drawImage(sx < 0 && S.back ? S.back : img, -lx, -ly, w, h);
  ctx.restore(); ctx.globalAlpha = 1;
}
const sz = S => [S.img.width / S.k, S.img.height / S.k];
// anchored at the centre
function put(name, x, y, r = 0, z = 0, sx = 1, s = 1, a = 1) { const S = typeof name === 'string' ? SP[name] : name; const [w, h] = sz(S); drawSprite(S, x, y, w / 2, h / 2, r, z, sx, s, a); }

// ---------- Motion: keyframes + the bounce and jitter of settling ----------
// keys: [t, x, y, rot, z, sx, ease, land, scale]
function pose(keys, t, id = 1) {
  if (t <= keys[0][0]) { const k = keys[0]; return { x: k[1], y: k[2], r: k[3], z: k[4], sx: k[5] ?? 1, s: k[8] ?? 1, pre: t < keys[0][0] }; }
  let i = keys.length - 1; for (let j = 0; j < keys.length - 1; j++) if (t < keys[j + 1][0]) { i = j; break; }
  const a = keys[i]; let p;
  if (i === keys.length - 1) p = { x: a[1], y: a[2], r: a[3], z: a[4], sx: a[5] ?? 1, s: a[8] ?? 1 };
  else {
    const b = keys[i + 1], e = EASE[b[6] || 'out'](seg(t, a[0], b[0]));
    p = { x: lerp(a[1], b[1], e), y: lerp(a[2], b[2], e), r: lerp(a[3], b[3], e), z: lerp(a[4], b[4], e), sx: lerp(a[5] ?? 1, b[5] ?? 1, e), s: lerp(a[8] ?? 1, b[8] ?? 1, e), moving: b[6] !== 'hold' };
  }
  for (let j = 0; j <= i; j++) {
    const k = keys[j]; if (!k[7]) continue;
    const s = t - k[0]; if (s < 0 || s > 0.34) continue;
    const n = Math.round(s / STEP), dec = Math.pow(0.45, n);
    p.r += k[7] * dec * (n % 2 ? -1 : 1); p.y += -2.2 * dec * (n % 2 ? 0 : 1) * Math.sign(k[7]);
  }
  if (p.moving) { const n = Math.round(t / STEP); p.x += (hash(id, n) - .5) * 1.4; p.y += (hash(id + 7, n) - .5) * 1.4; p.r += (hash(id + 3, n) - .5) * 0.5; }
  return p;
}
function putK(name, keys, t, id) { if (t < keys[0][0]) return null; const p = pose(keys, t, id); put(name, p.x, p.y, p.r, p.z, p.sx, p.s); return p; }
// slapped on: 0.17 s before, it is higher, slightly larger and tilted
const slap = (t0, x, y, r, dx = -16, dy = -24) => [[t0 - 0.17, x + dx, y + dy, r - 5, 4.5, 1, null, 0, 1.12], [t0, x, y, r, 0, 1, 'in', 0.9, 1.0]];
// slides in from off screen
const slide = (t0, t1, x, y, r, fx, fy, fr = 0, land = 0.8) => [[t0, x + fx, y + fy, r + fr, 2.0, 1], [t1, x, y, r, 0, 1, 'back', land]];

// ---------- Old-paper table top (tiles endlessly: mirrored tiling, no visible seams) ----------
function drawPaper(x0, y0, x1, y1) {
  const P = SP.paper, w = P.img.width / P.m.scale, h = P.img.height / P.m.scale, bx = P.m.x, by = P.m.y;
  const i0 = Math.floor((x0 - bx) / w), i1 = Math.floor((x1 - bx) / w), j0 = Math.floor((y0 - by) / h), j1 = Math.floor((y1 - by) / h);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    ctx.save(); ctx.translate(bx + i * w + (i & 1 ? w : 0), by + j * h + (j & 1 ? h : 0)); ctx.scale(i & 1 ? -1 : 1, j & 1 ? -1 : 1);
    ctx.drawImage(P.img, 0, 0, w + 0.5, h + 0.5); ctx.restore();
  }
}
// camera
function camTrack(keys, t) {
  let k = keys.length - 1; for (let i = 0; i < keys.length - 1; i++) if (t < keys[i + 1][0]) { k = i; break; }
  if (k === keys.length - 1 || t <= keys[0][0]) { const a = t <= keys[0][0] ? keys[0] : keys[k]; return { cx: a[1], cy: a[2], z: a[3], r: a[5] || 0 }; }
  const a = keys[k], b = keys[k + 1], p = EASE[b[4] || 'io'](seg(t, a[0], b[0]));
  return { cx: lerp(a[1], b[1], p), cy: lerp(a[2], b[2], p), z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), p)), r: lerp(a[5] || 0, b[5] || 0, p) };
}
let OFFX = 0;
function applyCam(c) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(W / 2 + OFFX, H / 2); ctx.rotate((c.r || 0) * D2R); ctx.scale(c.z, c.z); ctx.translate(-c.cx, -c.cy); }
function view(c) { const hw = W / 2 / c.z * 1.25 + Math.abs(OFFX) / c.z, hh = H / 2 / c.z * 1.25 + Math.abs(OFFX) / c.z; return [c.cx - hw, c.cy - hh, c.cx + hw, c.cy + hh]; }
const shake = (t, t0, a = 8) => { const s = t - t0; if (s < 0 || s > 0.5) return [0, 0]; const d = Math.exp(-s * 9); return [a * d * Math.sin(s * 70), a * 1.2 * d * Math.sin(s * 55 + 1)]; };

// ---------- Sound events ----------
const EVS = [];
const ev = (t, type, x = 960, extra = {}) => EVS.push(Object.assign({ t: +t.toFixed(3), type, pan: +clamp((x - 960) / 960, -1, 1).toFixed(2) }, extra));

// =====================================================================================
// Scene A (0–10.9): sky collage → the engraved plane flies in → the stamp assembles around it
// =====================================================================================
const A = {};
A.flats = {
  teal: [[0.0, 980, -40, 4, 2.2, 1], [0.5, 0, 0, 0, 0, 1, 'back', 0.6]],
  ochre: [[0.15, -760, 260, -24, 2.2, 1], [0.75, 0, 0, 0, 0, 1, 'back', -0.8]],
  strip: [[0.45, 620, -340, 6, 2.0, 1], [1.0, 0, 0, 0, 0, 1, 'back', 0.5]],
  sun: [[0.75, 60, 520, 18, 2.0, 1], [1.25, 0, 0, 0, 0, 1, 'back', 1.2]],
  cloud1: [[1.1, -560, 30, -8, 1.8, 1], [1.5, 0, 0, 0, 0, 1, 'back', 1.0]],
  cloud3: [[1.2, 520, -40, 8, 1.8, 1], [1.6, 0, 0, 0, 0, 1, 'back', -1.0]],
  cloud2: [[1.4, 80, 360, 6, 1.8, 1], [1.85, 0, 0, 0, 0, 1, 'back', 1.0]],
};
for (const [n, k] of Object.entries(A.flats)) { ev(k[0][0], 'slide', 960 + k[0][1] * 0.5, { d: k[1][0] - k[0][0], size: ['teal', 'strip', 'ochre'].includes(n) ? 1 : 0.6 }); ev(k[1][0], 'land', 960 + k[0][1] * 0.3, { w: ['teal', 'ochre'].includes(n) ? 0.9 : 0.6 }); }
function drawFlat(n, p) { const m = SP[n].m, [w, h] = sz(SP[n]); drawSprite(SP[n], m.x + w / 2 + p.x, m.y + h / 2 + p.y, w / 2, h / 2, p.r, p.z, p.sx, p.s); }
A.photo = [[1.55, 380, 640, -3.5, 4.5, 1, null, 0, 1.12], [1.75, 380, 640, -3.5, 0, 1, 'in', 1.0]];
ev(1.75, 'slap', 380);
// AIR MAIL: ransom-note letters pasted on one by one (eighth notes)
A.letters = M => { const out = []; let x = 120; M._ransom.airmail.forEach((n, i) => { if (!n) { x += 46; return; } const w = SP[n].img.width / B; out.push({ n, x: x + w / 2, y: 175 + (i % 2 ? 10 : -6), r: [-6, 4, -3, 0, 7, -4, 3, -5][i], t: 2.0 + i * 0.125 }); x += w - 6; }); return out; };
for (let i = 0; i < 8; i++) if (i !== 3) ev(2.0 + i * 0.125, 'slap', 150 + i * 90);
// where it is printed on the stamp: the plane lands where the stamp's own plane was
const ST_C = [1300, 470], ST_R = -2.0;            // centre and angle of the large stamp (world)
function planeHome() {
  const P = M.st_paper, pl = M.plane, kst = P.w / STAMP.bigW;   // st pixels / world
  const [pw, ph] = [pl.w / pl.srck * P.srck / kst, pl.h / pl.srck * P.srck / kst];
  const lx = (pl.src[0] * P.srck - P.crop[0]) / kst, ly = (pl.src[1] * P.srck - P.crop[1]) / kst;   // top left of the plane inside the stamp (world)
  const sw = P.w / kst, sh = P.h / kst;
  const cx = lx + pw / 2 - sw / 2, cy = ly + ph / 2 - sh / 2;          // plane centre relative to the stamp centre
  const c = Math.cos(ST_R * D2R), s = Math.sin(ST_R * D2R);
  return { x: ST_C[0] + cx * c - cy * s, y: ST_C[1] + cx * s + cy * c, scale: (pw) / (pl.w / B) };
}
function planeFlight(t) {   // 2.35–5.9 flies in; then rests on the stamp; flies off from 10.0
  const H_ = planeHome();
  const keys = [[2.35, -380, 640, 8, 2.6, 1], [3.6, 520, 520, -4, 2.8, 1, 'lin'], [4.9, 1060, 430, -10, 2.4, 1, 'lin'], [5.9, H_.x, H_.y, ST_R, 0.4, 1, 'out', 1.2],
    [10.0, H_.x, H_.y, ST_R, 0.4, 1, 'hold'], [10.45, H_.x + 760, H_.y - 520, -24, 3.0, 1, 'in']];
  const p = pose(keys, t, 501);
  if (t > 2.35 && t < 5.9) { const n = Math.round(t / STEP); p.y += 7 * Math.sin(t * 7.5); p.r += 2.0 * Math.sin(t * 7.5 + 1); }   // bobs up and down as it flies
  if (t >= 5.9 && t < 10.0) p.y += 1.5 * Math.sin((t - 5.9) * 3);
  p.s = H_.scale; return p;
}
ev(2.35, 'fly_plane', 200, { d: 3.5 }); ev(5.9, 'land', 1300, { w: 0.7 }); ev(10.0, 'fly_plane', 1500, { d: 0.5, out: 1 });
A.stamp = [[5.25, ST_C[0] + 120, ST_C[1] + 820, ST_R + 9, 3.0, 1], [5.85, ST_C[0], ST_C[1], ST_R, 0, 1, 'back', 0.8]];
ev(5.25, 'slide', 1300, { d: 0.6, size: 1 }); ev(5.85, 'land', 1300, { w: 1.0 });
A.tags = [['t_bluetag', 6.75, 1560, 250, 3, null], ['t_redtag', 7.8, 1660, 820, -2, [1590, 760]]];
for (const tg of A.tags) ev(tg[1], 'slap', tg[2]);
A.cam = [[0, 960, 540, 1.0, 'io'], [4.7, 960, 540, 1.0, 'io'], [6.3, 1200, 500, 1.08, 'io'], [9.95, 1240, 490, 1.14, 'io']];
function sceneA(t, tp, camOverride) {
  const c = camOverride || camTrack(A.cam, t); applyCam(c);
  drawPaper(...view(c));
  for (const n of ['teal', 'strip', 'ochre', 'sun', 'cloud1', 'cloud3']) { const k = A.flats[n]; if (tp >= k[0][0]) drawFlat(n, pose(k, tp, n.length * 13)); }
  if (tp >= A.flats.cloud2[0][0]) drawFlat('cloud2', pose(A.flats.cloud2, tp, 77));
  putK('photo', A.photo, tp, 11);
  for (const L of A.letters(M)) putK(L.n, slap(L.t, L.x, L.y, L.r), tp, L.t * 100);
  // flight dashes (a printed route): appear segment by segment behind the plane
  if (tp > 2.4 && tp < 6.4) {
    ctx.save(); ctx.strokeStyle = PAL.ink; ctx.globalAlpha = 0.55 * (1 - seg(tp, 5.9, 6.4)); ctx.lineWidth = 3; ctx.setLineDash([14, 12]); ctx.beginPath();
    for (let u = 2.4; u <= Math.min(tp, 5.6); u += 1 / 24) { const p = planeFlight(u); const x = p.x - 220, y = p.y + 40; u === 2.4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
  }
  if (tp >= A.stamp[0][0]) { const p = pose(A.stamp, tp, 21); put(STAMP.big, p.x, p.y, p.r, p.z); }
  for (let [n, t0, x, y, r, to] of A.tags) {
    if (!to) { const h_ = planeHome(); to = [h_.x + 120, h_.y - 40]; }
    if (tp < t0 - 0.17 || tp > 10.0) continue;
    const p = pose(slap(t0, x, y, r), tp, t0 * 10);
    if (tp >= t0) { ctx.save(); ctx.strokeStyle = n === 't_redtag' ? PAL.red : PAL.blue; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x - 40, y + (y < to[1] ? 18 : -18)); ctx.lineTo(to[0], to[1]); ctx.stroke();
      ctx.beginPath(); ctx.arc(to[0], to[1], 5, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); ctx.restore(); }
    put(n, p.x, p.y, p.r, p.z, 1, p.s);
  }
  if (tp >= 2.35 && tp < 10.45) { const p = planeFlight(tp); put('plane', p.x, p.y, p.r, p.z, 1, p.s); }
  return c;
}
// the stamp oval's position in the world (for the through-the-oval transition)
function stampOval() {
  const P = M.st_paper, kst = P.w / STAMP.bigW, sw = P.w / kst, sh = P.h / kst;
  const ox = (OVAL_SRC[0] * 2 - P.crop[0]) / kst - sw / 2, oy = (OVAL_SRC[1] * 2 - P.crop[1]) / kst - sh / 2;
  const c = Math.cos(ST_R * D2R), s = Math.sin(ST_R * D2R);
  return { x: ST_C[0] + ox * c - oy * s, y: ST_C[1] + ox * s + oy * c, rx: OVAL_SRC[2] * 2 / kst, ry: OVAL_SRC[3] * 2 / kst, r: ST_R };
}

// =====================================================================================
// Scene B (10.2–21.8): printing press, two passes; the second sheet is turned 180° before the blue
// =====================================================================================
const SB = { c: [1250, 520] };         // centre of the full sheet
SB.sheet1 = [[10.0, 1250, 520, 0, 0, 1], [14.45, 1250, 520, 0, 0, 1, 'hold'], [14.9, 2500, 470, 6, 2.0, 1, 'in']];

SF.cam = [[40.5, 1080, 520, 0.9, 'io', 1.5], [42.9, 1090, 520, 0.92, 'io', 0.5], [45.0, 0, 0, 3.1, 'io', 0]];
for (let b = 0; b < 8; b++) ev(40.62 + b * 0.25, 'drops', 1100, { n: 12 });
ev(41.05, 'slap', 1550); ev(42.2, 'slap', 1620); ev(45.45, 'slap', 1300);
function sceneF(t, tp, camOverride) {

for (let i = 0; i < 11; i++) ev(45.3 + i * 0.055, 'key', 1200);

// =====================================================================================
// Scene G (46.3–50): through the empty space of number 66, back to the sky: the inverted Jenny flies away
// =====================================================================================
const SG = {};
SG.cam = [[46.3, 960, 540, 1.0, 'io'], [50.0, 1000, 530, 1.04, 'lin'], [52.0, 1010, 528, 1.05, 'lin']];
SG.title = [['title_en2', 47.15, 560, 150, -2], ['title_zh2', 47.35, 330, 262, 1.5]];
for (const l of SG.title) ev(l[1], 'slap', l[2]);
// End-card credits: three more slips on the last collage (style name English / Chinese, sign-off), held to the end
SG.sign = [['sig_style_en', 49.55, 1345, 852, -1.5], ['sig_style_zh', 49.7, 1745, 858, 2.0], ['sig_line', 49.85, 1560, 928, -0.8]];
for (const l of SG.sign) ev(l[1], 'slap', l[2]);
function sceneG(t, tp, camOverride) {

  const pk = [[46.3, 2500, 560, 180, 2.4, 1], [50.0, 760, 600, 184, 2.4, 1, 'lin'], [52.0, -180, 620, 186, 2.4, 1, 'lin']];
  const p = pose(pk, tp, 99); p.y += 8 * Math.sin(tp * 6); p.r += 2 * Math.sin(tp * 6 + 1);

  for (let u = 46.3; u <= tp; u += 1 / 24) { const q = pose(pk, u, 99); const x = q.x + 380, y = q.y + 8 * Math.sin(u * 6) - 60; u === 46.3 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }

  drift('cloud2', 1500, 940, 0, 30, 1.1);

}

// =====================================================================================
// Subtitles: typewriter slip (English, typed one cell at a time) + black ransom-note slip (Chinese), stacked at bottom left
// =====================================================================================
function subtitles(T) {
  const cues = TL.cues; const i = cues.findIndex(c => T >= c.t0 && T < c.t1); if (i < 0) return;
  const q = cues[i], tp = stepT(T), id = String(i).padStart(2, '0');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const zh = SP['sub' + id + '_zh'], en = 'sub' + id + '_en', [zw, zh_] = sz(zh), [ew, eh] = sz(SP[en]);
  const p = pose(slap(q.t0 + 0.08, 96 + zw / 2, 948, -0.6, -6, -10), tp, 300 + i);
  drawSprite(zh, p.x, p.y, zw / 2, zh_ / 2, p.r, p.z * 0.4, 1, p.s);
  const nEn = SP[en].m.n, tEnd = q.t0 + 0.08 + Math.min(1.0, nEn / 55);
  typed(en, 110 + ew / 2, 1008, 0.4, q.t0 + 0.08, tEnd, tp, 0.1);
}

// =====================================================================================
// Scenes and transitions on the timeline
// =====================================================================================
function clipEllipse(cam, o) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath();
  // world oval → screen
  const sx = W / 2 + (o.x - cam.cx) * cam.z, sy = H / 2 + (o.y - cam.cy) * cam.z;
  ctx.ellipse(sx, sy, o.rx * cam.z, o.ry * cam.z, o.r * D2R, 0, 7); ctx.clip();
}
function renderFilm(T) {
  const tp = stepT(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = PAL.paper; ctx.fillRect(0, 0, W, H);
  if (T < 10.2) sceneA(T, tp);
  else if (T < 10.95) {                                  // through the stamp's oval
    const o = stampOval(), p = EASE.in(seg(T, 10.2, 10.95));
    const a = camTrack(A.cam, 9.95), cam = { cx: lerp(a.cx, o.x, EASE.out(seg(T, 10.2, 10.6))), cy: lerp(a.cy, o.y, EASE.out(seg(T, 10.2, 10.6))), z: Math.exp(lerp(Math.log(a.z), Math.log(14), p)), r: 0 };
    sceneA(T, tp, cam); ctx.save(); clipEllipse(cam, o); sceneB(T, tp); ctx.restore();
    // a ring of red-plate inner line on the oval edge (so it reads as passing through the stamp's frame)
  }
  else if (T < 21.45) sceneB(T, tp);
  else if (T < 21.85) {                                  // whip pan: B whips out to the left, C comes in from the right, a paper seam between them
    const u = EASE.io(seg(T, 21.45, 21.85)), off = -u * W * 1.08, seam = W + off + W * 0.04;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, Math.max(0, seam), H); ctx.clip(); OFFX = off; sceneB(T, Math.min(tp, 21.4), sceneBCam(21.45)); ctx.restore();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath(); ctx.rect(seam, 0, W - seam + 2, H); ctx.clip(); OFFX = off + W * 1.08; sceneC(T, tp, camTrack(SC.cam, 21.45)); ctx.restore();
    OFFX = 0;
  }
  else if (T < 31.0) sceneC(T, tp);
  else if (T < 35.0) sceneD(T, tp);
  else if (T < 40.5) sceneE(T, tp);
  else if (T < 46.3) sceneF(T, tp);
  else if (T < 47.1) {                                  // through the empty space of number 66
    const r = sceneF(T, tp); const c = r.c, [x, y] = r.slot, g = M.album.grid;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(W / 2, H / 2); ctx.rotate((c.r || 0) * D2R); ctx.scale(c.z, c.z); ctx.translate(-c.cx, -c.cy);

  // vignette

  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(60,40,20,0)'); g.addColorStop(1, 'rgba(60,40,20,0.16)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

// ---------- Page contract ----------
// text on screen (for readcheck): world coordinates → the current scene's camera → screen box
function camAt(T) {

  if (T < 35) return camTrack(SD.cam, T); if (T < 40.5) return sceneECam(T); if (T < 46.3) return T < 42.9 ? camTrack(SF.cam, T) : null; return camTrack(SG.cam, T);
}
function textItems() {

  A.letters(M).forEach(l => add(l.n, 2.9, 5.0, l.x, l.y));

}
window.TEXTS = t => {
  const T = FROM + t, out = []; const c = camAt(T); if (!c) return out;

window.render = t => renderFilm(FROM + t);
(async () => {
  await loadParts();

  window.READY = true;
