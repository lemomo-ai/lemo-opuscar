// ---------- the frame at film time t ----------
const EVF = [];
function mapFrame(t, dist) {
  // cut-away for the cross-section (15.0 → 20.0)
  const cutOn = t >= 15.65 && t < 20.0;
  CUT.p.set(SEC.P0.X, SEC.P0.Z, SEC.nx, SEC.nz); CUT.d.value = cutOn ? 2 + 600 * eio(seg(t, 15.7, 16.6)) : 0;
  wall.mesh.visible = cutOn; wall.m.uniforms.op.value = ss(seg(t, 15.7, 16.0));
  // routes (S2)
  const routeFade = 1 - ss(seg(t, 9.6, 11.0));
  for (const R of routes) { const k = eo(seg(t, R.T.t + .1, R.T.t + 1.3)); for (const r of [R.glow, R.core]) rv(r, { revB: k * r.L, inten: routeFade, flowPh: t * 26, soft: 6 }); }
  { const k = eio(seg(t, 6.6, 8.6)); for (const r of [trunk.glow, trunk.core]) rv(r, { revB: k * r.L, inten: (1 - ss(seg(t, 10.0, 11.4))) * (t < 25 ? 1 : 0), flowPh: t * 30, soft: 8 }); }
  // lanes ignite on the downbeat at 12.5; dim while the camera is far away over Arabia
  const far = ss(seg(dist, 900, 1600));
  for (const [li, L] of lanes.entries()) {
    const sStart = li ? nearest(L.pts, L.S, 55.15, 26.25) : nearest(L.pts, L.S, 57.35, 25.68);
    const k = eo(seg(t, 12.5 + li * .12, 14.0 + li * .12)), head = lerp(sStart, L.S[L.S.length - 1], k);
    const on = ss(seg(t, 12.45, 12.7)) * (1 - .5 * far), near = lerp(.32, 1, ss(seg(dist, 25, 160)));
    rv(L.band, { inten: on * near * near }); rv(L.core, { inten: on * near });
    for (const r of [L.band, L.core]) rv(r, { revB: head, head, headAmt: 1.1 * (1 - ss(seg(k, .8, 1))), flowPh: t * 9 });
    const ke = eo(seg(t, 12.7 + li * .12, 14.3 + li * .12)), he = lerp(sStart, L.S[L.S.length - 1], ke);
    for (const r of L.edges) rv(r, { revB: he, inten: ss(seg(t, 12.7, 13.0)) * (1 - far) });
    rv(L.wake, { inten: 1 - far });
  }
  // ships
  const shipS = [[], []], shipA = [[], []], sc = clamp(dist / 240, .2, 1);
  for (const s of ships) {
