<!doctype html>
<html><head><meta charset="utf-8"><title>定格 Freeze Frame</title>
<style>

@font-face{font-family:SansSC;src:url(fonts/sans700.woff2) format('woff2');font-weight:700}

</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Sports telestrator "Freeze Frame" (《定格》) — three goals in 12 minutes. render(t) is deterministic; footage frames are loaded and cached on demand.
// Footage frames: a = third goal (Commons clip), b = first goal, main camera, c = second goal, main camera F001–090 + high reverse angle F091–192 (official highlights)
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1920, H = 1080;
const Q = new URLSearchParams(location.search), DBG = Q.get('dbg') === '1', NOSUB = Q.get('nosub') === '1';   // nosub=1: used to render the cover
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = (k, s = 1.7) => { k = clamp(k) - 1; return k * k * ((s + 1) * k + s) + 1; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// —— Palette ——
const COL = {
  ink: '#FFD400',      // attacking side / main line: fluorescent yellow marker
  def: '#3FD8FF',      // defending side: cyan
  space: '#FF3B30',    // space (gap): red
  chalk: '#F4F1E8',    // whiteboard pen
  board: '#0C1411',    // programme base board: dark green-black
  card: 'rgba(8,12,14,0.9)',
  paper: '#F2ECDD', pen: '#1E2A44'
};
const F_ZH = 'SansSC', F_C = 'Cond', F_M = 'Mono';

// —— Footage ——
const cache = new Map();
function img(src) {
  if (!cache.has(src)) {
    if (cache.size > 90) { const k = cache.keys().next().value; cache.delete(k); }
    cache.set(src, new Promise(res => { const im = new Image(); im.onload = () => im.decode().then(() => res(im), () => res(im)); im.onerror = () => res(null); im.src = src; }));
  }
  return cache.get(src);
}
const NFR = { a: 350, b: 196, c: 192 };
const fsrc = (f, clip = 'a') => `assets/${clip}/${String(clamp(Math.round(f), 1, NFR[clip])).padStart(3, '0')}.jpg`;
let TL, STAD, HAK, PITCH;

// —— Tracking (source 1280×720 coordinates, point at the player's feet; hand-set keyframes) ——
const P = (x, y) => [x * 1.5, y * 1.5];
const Q2 = arr => arr.map(([f, x, y]) => [f, x / 1.5, y / 1.5]);
const TRK = {
  kald: [[13,13,430],[19,87,410],[25,154,414],[31,205,405],[35,226,393],[37,230,392],[43,228,388],[49,234,388],[55,250,386],[56,251,386],[61,243,386],[67,220,382],[73,154,382]],
  ball: [[1,484,412],[7,388,401],[13,330,407],[19,298,406],[25,278,397],[31,252,390],[35,239,386],[37,240,386],[43,250,382],[49,254,382],[55,262,388],[56,264,388],[57,278,358],[58,327,347],[59,369,337],[60,419,326],[61,461,315],[62,500,307],[64,580,295],[67,695,277],[70,812,265],[73,888,256],[74,905,255],[75,925,252],[76,945,249],[77,965,246],[78,982,243],[80,1000,241],[82,962,240],[84,922,240]],
  d26w: [[43,450,388],[49,426,390],[55,410,383],[56,408,383],[58,400,383],[61,390,383]],
  r3: [[262,1100,590],[272,947,598],[288,998,598],[300,832,595],[308,900,605],[310,986,614]],
  r26: [[262,330,560],[272,538,572],[288,550,585],[300,614,550],[308,632,548],[310,640,550]],
  // —— First goal (clip b), second goal (clip c): measured in 1920 frame coordinates, converted back to source coordinates here ——
  dir: Q2([[86,1794,894],[90,1794,894],[96,1800,842],[100,1744,841],[106,1779,836],[110,1833,833]]),
  zaj: Q2([[100,520,600],[106,595,590],[110,670,570],[113,735,570],[116,795,555],[119,857,564],[121,895,550]]),
  bb: Q2([[96,1700,800],[100,1562,737],[106,1300,660],[110,1180,613],[114,1075,570],[116,1035,555],[119,985,540],[121,945,525]]),
  rball: [[262,620,560],[272,745,579],[288,657,588],[300,687,585],[308,710,552],[310,600,426],[312,554,336],[314,550,266],[316,570,210],[318,584,166],[320,594,150],[322,624,140],[324,640,154],[326,650,184],[328,674,220],[330,712,256],[332,740,272],[334,736,280],[336,716,280]]
};
function at(tr, f) {
  const k = TRK[tr]; if (f <= k[0][0]) return P(k[0][1], k[0][2]);
  for (let i = 1; i < k.length; i++) if (f <= k[i][0]) { const a = k[i - 1], b = k[i], u = (f - a[0]) / (b[0] - a[0]); return P(lerp(a[1], b[1], u), lerp(a[2], b[2], u)); }
  const l = k[k.length - 1]; return P(l[1], l[2]);
}

// —— Timeline ——
function S(id) { return TL.seg.find(s => s.id === id); }
function segAt(t) { for (const s of TL.seg) if (t >= s.t0 && t < s.t1) return s; return TL.seg[TL.seg.length - 1]; }
function srcFrame(s, t) {
  const k = seg(t, s.t0, s.t1);
  if (s.id === 'rewind') return lerp(s.f0, s.f1, eio(k));
  return lerp(s.f0, s.f1, k);
}

// —— Small drawing helpers ——
function wob(pts, amp, seed) {
  // hand-drawn feel: small jitter along the normal (deterministic)
  return pts.map((p, i) => { if (i === 0 || i === pts.length - 1) return p; const n = (hash(seed + i * 3.1) - .5) * 2 * amp; return [p[0] + n, p[1] + n * .6]; });
}
function bez(a, c, b, n = 28) { const o = []; for (let i = 0; i <= n; i++) { const u = i / n; o.push([(1-u)*(1-u)*a[0] + 2*(1-u)*u*c[0] + u*u*b[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*c[1] + u*u*b[1]]); } return o; }
function plen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
function partial(pts, k) {
  const L = plen(pts) * clamp(k); const o = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); if (acc + d >= L) { const u = (L - acc) / (d || 1); o.push([lerp(pts[i-1][0], pts[i][0], u), lerp(pts[i-1][1], pts[i][1], u)]); return o; } acc += d; o.push(pts[i]); }
  return o;
}
function path(pts) { X.beginPath(); X.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]); }
// Marker line: dark outline + bright core + glow; optional dash; arrow = arrowhead at the end
function marker(pts, k, col, w = 9, o = {}) {
  if (k <= 0) return;
  const p = partial(pts, k); if (p.length < 2) return;
  X.save(); X.lineCap = 'round'; X.lineJoin = 'round';
  if (o.dash) X.setLineDash(o.dash);
  path(p); X.strokeStyle = 'rgba(0,0,0,0.55)'; X.lineWidth = w + 6; X.stroke();
  X.shadowColor = col; X.shadowBlur = 18; path(p); X.strokeStyle = col; X.lineWidth = w; X.stroke();
  X.shadowBlur = 0; path(p); X.strokeStyle = 'rgba(255,255,255,0.55)'; X.lineWidth = Math.max(2, w * .28); X.stroke();
  X.setLineDash([]);
  if (o.arrow && k > .9) {
    const a = p[p.length - 1], b = p[Math.max(0, p.length - 4)]; const ang = Math.atan2(a[1] - b[1], a[0] - b[0]); const s = w * 3.2 * eo(seg(k, .9, 1));
    X.translate(a[0], a[1]); X.rotate(ang);
    X.beginPath(); X.moveTo(s * .4, 0); X.lineTo(-s, -s * .62); X.lineTo(-s * .62, 0); X.lineTo(-s, s * .62); X.closePath();
    X.fillStyle = 'rgba(0,0,0,0.55)'; X.lineWidth = 6; X.strokeStyle = 'rgba(0,0,0,0.55)'; X.stroke();
    X.shadowColor = col; X.shadowBlur = 16; X.fillStyle = col; X.fill();
  }
  X.restore();
}
// Player ring: perspective ellipse + rotating dashed outer ring + vertical light column
function ring(x, y, r, col, k = 1, t = 0, o = {}) {
  if (k <= 0) return;
  const ry = r * .36;
  X.save();
  if (o.beam) {
    const g = X.createLinearGradient(x, y - r * 3.2, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, col + '55');
    X.globalAlpha = k * .9; X.fillStyle = g;
    X.beginPath(); X.moveTo(x - r * .55, y - r * 3.2); X.lineTo(x + r * .55, y - r * 3.2); X.lineTo(x + r, y); X.lineTo(x - r, y); X.closePath(); X.fill();
    X.globalAlpha = 1;
  }
  X.beginPath(); X.ellipse(x, y, r * eo(k), ry * eo(k), 0, 0, Math.PI * 2); X.fillStyle = col + '30'; X.fill();
  X.lineWidth = 11; X.strokeStyle = 'rgba(0,0,0,0.5)';
  X.beginPath(); X.ellipse(x, y, r, ry, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); X.stroke();
  X.shadowColor = col; X.shadowBlur = 16; X.lineWidth = 6; X.strokeStyle = col; X.stroke(); X.shadowBlur = 0;
  X.setLineDash([16, 14]); X.lineDashOffset = -t * 60; X.lineWidth = 3; X.globalAlpha = .85 * k;
  X.beginPath(); X.ellipse(x, y, r * 1.32, ry * 1.32, 0, 0, Math.PI * 2); X.stroke();
  X.restore();
}
// Label: black box + coloured vertical bar; large Chinese text + one line of small English text
function tag(x, y, zh, en, col, k = 1, o = {}) {
  if (k <= 0) return;
  X.save();
  X.font = `900 ${o.size || 40}px ${F_ZH}`; const wz = X.measureText(zh).width;
  X.font = `600 ${o.esize || 21}px ${F_C}`; X.letterSpacing = '2px'; const we = X.measureText(en).width; X.letterSpacing = '0px';
  const w = Math.max(wz, we) + 46, h = (o.size || 40) + (o.esize || 21) + 30;
  const ax = o.right ? x - w : x;
  const kk = eo(k);
  X.beginPath(); X.rect(ax, y, w * kk, h); X.clip();
  X.fillStyle = COL.card; X.fillRect(ax, y, w, h);
  X.fillStyle = col; X.fillRect(ax, y, 8, h);
  X.fillStyle = '#fff'; X.font = `900 ${o.size || 40}px ${F_ZH}`; X.textBaseline = 'top'; X.fillText(zh, ax + 26, y + 10);
  X.fillStyle = col; X.font = `600 ${o.esize || 21}px ${F_C}`; X.letterSpacing = '2px'; X.fillText(en, ax + 27, y + 16 + (o.size || 40));
  X.restore();
}
function cover(im, sc = 1, fx = .5, fy = .5, alpha = 1) {
  if (!im) return; const iw = im.width, ih = im.height; const s = Math.max(W / iw, H / ih) * sc;
  const w = iw * s, h = ih * s; X.globalAlpha = alpha; X.drawImage(im, (W - w) * fx, (H - h) * fy, w, h); X.globalAlpha = 1;
}
// Footage frame: cross-blends two frames in slow motion; zoom is centred on (cx,cy)
async function drawSrc(f, o = {}) {
  const a = Math.floor(f), u = f - a;
  const A = await img(fsrc(a, o.clip)), B = u > 0.02 ? await img(fsrc(a + 1, o.clip)) : null;
  X.save();
  if (o.zoom && o.zoom !== 1) { const z = o.zoom, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2; X.translate(cx, cy); X.scale(z, z); X.translate(-cx, -cy); }
  if (o.jx) X.translate(o.jx, 0);
  if (A) X.drawImage(A, 0, 0, W, H);
  if (B) { X.globalAlpha = u; X.drawImage(B, 0, 0, W, H); X.globalAlpha = 1; }
  X.restore();
}
function grade(o = {}) {
  // one grade for all: slightly darkened corners; on a freeze, desaturate + a bit cooler
  if (o.freeze) { X.save(); X.globalCompositeOperation = 'saturation'; X.fillStyle = `rgba(128,128,128,${0.42 * o.freeze})`; X.fillRect(0, 0, W, H); X.restore();
    X.fillStyle = `rgba(10,22,30,${0.16 * o.freeze})`; X.fillRect(0, 0, W, H); }
  const g = X.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.38 + 0.2 * (o.freeze || 0)})`); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
// Spotlight: darken outside the focus ellipse
function spot(cx, cy, rx, ry, k) {
  if (k <= 0) return;
  X.save(); X.fillStyle = `rgba(0,0,0,${0.42 * k})`;
  X.beginPath(); X.rect(0, 0, W, H); X.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2, true); X.fill('evenodd');
  X.restore();
}
function flash(t, t0, d = .12, a = .65) { const k = seg(t, t0, t0 + d); if (k > 0 && k < 1) { X.fillStyle = `rgba(255,255,255,${a * (1 - k)})`; X.fillRect(0, 0, W, H); } }

// —— Programme graphics package ——
function bugTop(mode, k = 1) {
  // top right: programme name + mode; also covers the broadcaster logo in the footage
  if (k <= 0) return;
  const M = { live: ['直播回看', 'LIVE', '#FF3B30'], ana: ['战术分析', 'ANALYSIS', COL.ink], rep: ['反打回放', 'REPLAY', COL.def] }[mode];
  X.save(); X.translate(lerp(60, 0, eo(k)), 0); X.globalAlpha = clamp(k * 2);
  const x = 1452, y = 38, h = 72;   // covers the broadcaster logo (logo sits at y 75–107)
  X.fillStyle = COL.ink; X.fillRect(x, y, 112, h);
  X.fillStyle = '#0B0F14'; X.font = `900 38px ${F_ZH}`; X.textBaseline = 'middle'; X.fillText('定格', x + 18, y + h / 2 + 1);
  X.fillStyle = '#080C0E'; X.fillRect(x + 112, y, 316, h);
  X.fillStyle = '#fff'; X.font = `800 italic 26px ${F_C}`; X.letterSpacing = '3px'; X.fillText('FREEZE FRAME', x + 130, y + 24);
  X.letterSpacing = '1px'; X.fillStyle = M[2]; X.font = `500 20px ${F_ZH}`; X.fillText(M[0], x + 130, y + 52);
  X.font = `600 18px ${F_C}`; X.letterSpacing = '3px'; X.fillText(M[1], x + 226, y + 52);
  if (mode === 'live') { X.beginPath(); X.arc(x + 404, y + 24, 7, 0, Math.PI * 2); X.fillStyle = '#FF3B30'; X.fill(); }
  X.restore();
}
// Score bar state: one span per goal, flips on the frame of the goal (55′ 0→1, 61′ 1→2, 67′ 2→3)
let GOALS = [];
function scoreAt(t) {
  let st = { fb: 0, min: '55′', g: 0 };
  for (const G of GOALS) { if (t < G.from) break; st = { fb: t >= G.t ? G.n : G.n - 1, min: G.min, g: seg(t, G.t, G.t + .5), n: G.n }; }
  return st;
}
function bugScore(st, k = 1) {
  // bottom-right score bar: BJK 3–x FB minute, flips on the frame of the goal; also covers the URL watermark in the footage
  if (k <= 0) return;
  X.save(); X.globalAlpha = clamp(k * 2); X.translate(lerp(40, 0, eo(k)), 0);
  const x = 1392, y = 926, h = 70;
  X.fillStyle = '#080C0E'; X.fillRect(x, y, 488, h);
  X.fillStyle = '#fff'; X.font = `800 italic 36px ${F_C}`; X.textBaseline = 'middle'; X.letterSpacing = '2px';
  X.fillText('BJK', x + 22, y + h / 2 + 1);
  X.fillStyle = COL.ink; X.fillRect(x + 108, y + 10, 150, h - 20);
  X.fillStyle = '#0B0F14'; X.font = `800 italic 44px ${F_C}`; X.textAlign = 'center';
  const g = st.g && st.g < 1 ? st.g : 1, fbN = String(st.g > 0 && st.g < .5 ? st.fb - 1 : st.fb);
  X.fillText('3', x + 145, y + h / 2 + 2); X.fillText('–', x + 183, y + h / 2 + 2);
  X.save(); X.beginPath(); X.rect(x + 200, y + 10, 50, h - 20); X.clip();
  const dy = g > 0 && g < 1 ? Math.sin(g * Math.PI) * -6 : 0; X.fillText(fbN, x + 222, y + h / 2 + 2 + dy); X.restore();
  X.textAlign = 'left'; X.fillStyle = '#fff'; X.font = `800 italic 36px ${F_C}`; X.fillText('FB', x + 276, y + h / 2 + 1);
  X.fillStyle = 'rgba(255,255,255,0.14)'; X.fillRect(x + 352, y + 12, 2, h - 24);
  X.fillStyle = COL.ink; X.font = `800 italic 36px ${F_C}`; X.fillText(st.min, x + 376, y + h / 2 + 1);
  if (g > 0 && g < 1) { X.fillStyle = `rgba(255,212,0,${0.6 * (1 - g)})`; X.fillRect(x, y, 488, h); }
  X.restore();
}
function clockTag(f, mode) {
  // top left: source footage timecode + frame number (all the data is counted from here)
  X.save(); X.fillStyle = 'rgba(8,12,14,0.85)'; X.fillRect(40, 38, 330, 52);
  X.fillStyle = mode === 'freeze' ? COL.ink : '#fff'; X.font = `500 24px ${F_M}`; X.textBaseline = 'middle';
  const s = (f - 1) / 25; const ss = Math.floor(s), cc = Math.round((s - ss) * 100);
  const icon = mode === 'freeze' ? '❚❚' : mode === 'rew' ? '◀◀' : mode === 'slow' ? '▶ ½' : '▶';
  X.fillText(`${icon}  ${String(ss).padStart(2, '0')}.${String(Math.min(cc, 99)).padStart(2, '0')}s  F${String(Math.round(f)).padStart(3, '0')}`, 58, 65);
  X.restore();
}
// Subtitles: one Chinese line on top, one English line below, each language takes exactly one line (no wrapping; if it doesn't fit, shorten the line, don't shrink the type).
// A cue runs from when the voice-over line starts to the end of the line + 0.45 s, or 0.08 s before the next line starts (tools/cues.py exports the .srt with the same rule).
const SUB = { cx: 880, zh: 38, en: 32, maxW: 960 };   // centre x=880: right edge no further than 1360, clear of the bottom-right score bar (x≥1392)
function cueSpan(i) {
  const v = TL.vo[i], d = (TL.vdur && TL.vdur[v.id]) || 2.5, nx = TL.vo[i + 1];
  return [v.t, Math.min(v.t + d + .45, nx ? nx.t - .08 : 1e9)];
}
function subtitle(t) {
  if (NOSUB) return;
  TL.vo.forEach((v, i) => {
    const [t0, t1] = cueSpan(i);
    const a = seg(t, t0, t0 + .12) * (1 - seg(t, t1 - .18, t1)); if (a <= 0) return;
    X.save(); X.globalAlpha = a; X.textAlign = 'center'; X.textBaseline = 'middle';
    X.font = `500 ${SUB.zh}px ${F_ZH}`; const wz = X.measureText(v.zh).width;
    X.font = `600 ${SUB.en}px ${F_C}`; X.letterSpacing = '1px'; const we = X.measureText(v.text).width;
    const w = Math.max(wz, we) + 52;
    if (w > SUB.maxW) console.warn('subtitle too wide (shorten the line):', v.id, Math.round(w));
    const y0 = 938, h = 106;
    X.fillStyle = 'rgba(0,0,0,0.64)'; X.fillRect(SUB.cx - w / 2, y0, w, h);
    X.fillStyle = COL.ink; X.fillRect(SUB.cx - w / 2, y0, 4, h);
    X.letterSpacing = '0px'; X.fillStyle = '#fff'; X.font = `500 ${SUB.zh}px ${F_ZH}`; X.fillText(v.zh, SUB.cx, y0 + 34);
    X.letterSpacing = '1px'; X.fillStyle = 'rgba(255,255,255,0.86)'; X.font = `600 ${SUB.en}px ${F_C}`; X.fillText(v.text, SUB.cx, y0 + 79);
    X.restore();
  });
}
function wipe(t, t0, d = .34) {
  // package transition: yellow diagonal band sweeping across (not a page turn)
  const k = seg(t, t0 - d / 2, t0 + d / 2); if (k <= 0 || k >= 1) return;
  const x = lerp(-900, W + 900, eio(k));
  X.save(); X.translate(x, 0); X.transform(1, 0, -0.38, 1, 0, 0);
  X.fillStyle = COL.ink; X.fillRect(-260, 0, 520, H);
  X.fillStyle = '#0B0F14'; X.fillRect(-300, 0, 40, H); X.fillRect(260, 0, 18, H);
  X.restore();
}

// —— Sections ——
function sting(t) {
  X.fillStyle = COL.board; X.fillRect(0, 0, W, H);
  // whiteboard pen draws the half-pitch line frame (0.05–0.9)
  const k = seg(t, .04, .8);
  X.save(); X.globalAlpha = .28;
  const fieldL = [[160, 980], [520, 300], [1400, 300], [1760, 980]];
  marker(wob(fieldL, 3, 1), k, COL.chalk, 4);
  marker(wob([[430, 470], [1490, 470]], 2, 2), seg(t, .2, .7), COL.chalk, 4);
  marker(wob([[700, 300], [655, 385], [1265, 385], [1220, 300]], 2, 3), seg(t, .25, .75), COL.chalk, 4);

    const m = PITCH[d.id].marks_m.shot, last = d.id === 'g3';
    const k = last ? 1 : eo(seg(lt, d.t, d.t + .25));
    if (k <= 0) return;
    const [px, py] = last ? V(m[0], m[1]) : B2(m[0], m[1]);
    // shot line: strike point → centre of the goal
    const lk = last ? seg(lt, 1.5, 2.0) : seg(lt, d.t + .15, d.t + .5);
    marker([[px, py], B2(0, 0)], eo(lk), COL.ink, last ? 7 : 5, { arrow: true, dash: last ? null : [16, 12] });
    const r = last ? 22 : 16;
    X.save(); X.globalAlpha = k; X.fillStyle = COL.ink; X.shadowColor = COL.ink; X.shadowBlur = 18;
    X.beginPath(); X.ellipse(px, py, r * (last ? lerp(1.8, 1, wk) : k), r * (last ? lerp(.36 * 1.8, 1, wk) : k), 0, 0, 7); X.fill();
    X.shadowBlur = 0; X.fillStyle = '#0B0F14'; X.font = `800 italic ${last ? 22 : 17}px ${F_C}`; X.textAlign = 'center'; X.textBaseline = 'middle';
    if (wk > .9) X.fillText(String(i + 1), px, py + 1);
    X.restore();
    // small marker on the map: minute
    X.save(); X.globalAlpha = last ? seg(wk, .8, 1) : k; X.fillStyle = '#fff'; X.font = `800 italic 34px ${F_C}`;
    if (last) { X.textAlign = 'center'; X.textBaseline = 'bottom'; X.fillText(d.min, px, py - r - 8); }
    else { X.textAlign = 'right'; X.textBaseline = 'middle'; X.fillText(d.min, px - r - 12, py + 2); }
    X.restore();
  });
  // left column: title + three comparison rows (each row appears with its point), holds ≥2.5 s once everything is in place
  const L0 = 110;
  X.save(); X.textBaseline = 'alphabetic';
  const ta = eo(seg(lt, 1.2, 1.5));
  X.globalAlpha = ta; X.fillStyle = COL.ink; X.fillRect(L0, 150, 10, 112);
  X.fillStyle = '#fff'; X.font = `900 60px ${F_ZH}`; X.fillText('三球起脚点', L0 + 34, 214);
  X.fillStyle = COL.ink; X.font = `600 22px ${F_C}`; X.letterSpacing = '5px'; X.fillText('SHOT MAP · 55′  61′  67′', L0 + 36, 254); X.letterSpacing = '0px';
  const rows = [SH[0], SH[1], SH[2]], RT = [1.45, 1.65, 1.85];
  rows.forEach((d, i) => {
    const y = 380 + i * 150, a = eo(seg(lt, RT[i], RT[i] + .3)); if (a <= 0) return;
    const m = PITCH[d.id].marks_m.shot, dist = Math.round(Math.hypot(m[0], m[1]));
    X.globalAlpha = a;
    if (i > 0) { X.fillStyle = 'rgba(244,241,232,0.12)'; X.fillRect(L0, y - 104, 700 * a, 1); }
    X.fillStyle = i === 2 ? COL.ink : 'rgba(244,241,232,0.8)'; X.font = `800 italic 58px ${F_C}`; X.fillText(d.min, L0, y);
    X.fillStyle = '#fff'; X.font = `700 34px ${F_ZH}`; X.fillText(d.zh, L0 + 130, y - 10);
    X.fillStyle = 'rgba(244,241,232,0.5)'; X.font = `600 19px ${F_C}`; X.letterSpacing = '2px'; X.fillText(d.en, L0 + 132, y + 22); X.letterSpacing = '0px';
    X.textAlign = 'right'; X.fillStyle = i === 2 ? COL.ink : '#fff'; X.font = `800 italic 64px ${F_C}`; X.fillText('≈' + dist + ' m', L0 + 760, y + 2); X.textAlign = 'left';
  });
  X.globalAlpha = eo(seg(lt, 2.1, 2.4)); X.fillStyle = 'rgba(244,241,232,0.45)'; X.fillRect(L0, 836, 4, 26);
  X.fillStyle = 'rgba(244,241,232,0.6)'; X.font = `500 22px ${F_ZH}`; X.fillText('起脚点到球门中心的距离：按各自画面里的禁区线做透视换算，误差约 1 米', L0 + 18, 858);
  X.restore();
  bugTop('ana', 1);
  bugScore(scoreAt(t), 1 - seg(lt, .5, .8));   // covers the URL watermark before flattening, exits afterwards
  flash(t, s.t0, .1, .55);
}

// —— Main render ——
const FZ = ['fz1', 'fz2', 'fz3', 'fz4', 'g1fz'];
const LIVE = ['live', 'g1live', 'g1go'];   // g2go is slow motion + VAR review: counts as an analysis section (corner bug 「战术分析」 (ANALYSIS), top-left timecode ▶ ½)
async function render(t) {
  const s = segAt(t);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.filter = 'none';
  if (s.id === 'sting') { sting(t); }
  else if (s.id === 'record') { await record(t); }
  else if (s.id === 'notes') { notes(t); }
  else if (s.id === 'end') { await endSlate(t); }
  else if (s.id === 'card') { await endCard(t); }
  else if (s.id === 'g2split' || s.id === 'g2fz') { await splitView(s, t); }
  else if (s.id === 'map') { await shotMap(s, t); }
  else {
    const f = srcFrame(s, t), clip = s.clip || 'a';
    const fz = FZ.includes(s.id);
    const lt = t - s.t0;
    const punch = fz ? lerp(1.035, 1.0, eo(seg(lt, 0, .35))) * 1.0 + 0.012 * seg(lt, 0, s.t1 - s.t0) : 1;
    const jx = s.id === 'rewind' ? (hash(Math.floor(t * 30)) - .5) * 26 : 0;
    await drawSrc(f, { zoom: punch, jx, clip });
    if (s.id === 'rewind') rewindFx(t);
    grade({ freeze: fz ? eo(seg(lt, 0, .25)) : 0 });
    X.save(); X.translate(W / 2, H / 2); X.scale(punch, punch); X.translate(-W / 2, -H / 2);
    if (DBG) dbgMarks(f, clip);
    else if (clip === 'b') overlayG1(s, t, f);
    else if (clip === 'a') overlayAnalysis(s, t, f);
    X.restore();
    if (s.id === 'g2go') varStamp(t, VART);
    const mode = LIVE.includes(s.id) ? 'live' : s.id.startsWith('rep') || s.id === 'fz4' ? 'rep' : 'ana';
    bugTop(mode, 1);   // the package is there from the first frame: covers the broadcaster logo in the footage
    bugScore(scoreAt(t), 1);
    if (!LIVE.includes(s.id)) clockTag(f, fz ? 'freeze' : s.id === 'rewind' ? 'rew' : 'slow');
    if (s.id === 'live') transcript(t);
    if (fz) flash(t, s.t0, .1, .55);
    for (const G of GOALS) if (G.ring && t >= G.t && t < G.t + .6) netPulse(t, G);
  }
  subtitle(t);
  // package transition between sections
  for (const tt of [S('record').t0, S('g1live').t0, S('g2split').t0, S('live').t0, S('rep1').t0, S('notes').t0, S('end').t0, S('card').t0]) wipe(t, tt);
}
let VART = 0;
// Reading-time self-check (core/render/readcheck.mjs): reports only "information to be read" — match card title and score, split-screen camera names, tactics-board title and three rows, three review rows, end card.
// Freeze labels and the VAR stamp are on-screen echoes of the voice-over subtitles (subtitle hold time is handled by the .srt), so they are not reported here.
window.TEXTS = t => {
  const out = [], s = segAt(t), lt = t - s.t0, R = (id, text, x0, y0, x1, y1) => out.push({ id, text, x0, y0, x1, y1 });
  if (s.id === 'record') { if (lt > .4) R('rec', '赛况记录', 120, 170, 420, 260); if (lt > 1.45) R('score', '3–3', 460, 340, 820, 520); }
  if (s.id === 'g2split' || s.id === 'g2fz') { if (t - S('g2split').t0 > .4) { R('camA', 'A 主机位', 40, 38, 370, 110); R('camB', 'B 反打高机位', 1000, 38, 1330, 110); } }
  if (s.id === 'map') {
    if (lt > 1.5) R('mapT', '三球起脚点', 110, 150, 600, 262);
    [['55′ 门前推射', 'g1'], ['61′ 任意球头球', 'g2'], ['67′ 禁区外远射', 'g3']].forEach(([txt, id], i) => {
      if (lt > [1.45, 1.65, 1.85][i] + .3) { const m = PITCH[id].marks_m.shot; R('row' + i, txt + ' ≈' + Math.round(Math.hypot(m[0], m[1])) + ' m', 110, 320 + i * 150, 880, 410 + i * 150); } });
  }
  if (s.id === 'notes') [['接球 → 起脚 0.84 秒', .3], ['起脚 → 入网 ≈0.9 秒', .6], ['12 分钟扳平', .9]].forEach(([txt, d], i) => { if (lt > d + .55) R('n' + i, txt, 150, 260 + i * 190, 1300, 440 + i * 190); });
  if (s.id === 'end' && lt > .4) R('e67', '67′', 110, 170, 560, 450);
  if (s.id === 'card' && lt > .55 && t < s.t1 - .3) { R('cT', '定格', 116, 270, 420, 430); R('cE', 'Freeze Frame', 122, 440, 560, 510); R('cS', 'SPORTS TELESTRATOR · 体育战术板', 122, 556, 760, 600); R('cL', 'LemoLab × Claude Opus 5.5', 122, 612, 520, 650); }
  return out;
};
function netPulse(t, G) {
  // the frame of the goal: a yellow ring spreads out at the net
  const k = seg(t, G.t, G.t + .6); X.save(); X.globalAlpha = 1 - k; X.strokeStyle = COL.ink; X.lineWidth = 8;
  X.beginPath(); X.ellipse(G.ring[0], G.ring[1], 40 + 220 * eo(k), 30 + 150 * eo(k), 0, 0, Math.PI * 2); X.stroke(); X.restore();
}
function rewindFx(t) {
  // rewind: horizontal tracking stripes + corner bug
  X.save();
  for (let i = 0; i < 4; i++) { const y = (hash(Math.floor(t * 30) + i * 7) * H) | 0; X.fillStyle = 'rgba(255,255,255,0.18)'; X.fillRect(0, y, W, 6 + hash(i + t) * 24); }
  X.fillStyle = 'rgba(255,255,255,0.92)'; X.font = `800 italic 120px ${F_C}`; X.textBaseline = 'middle'; X.fillText('◀◀', 120, 540);
  X.font = `900 46px ${F_ZH}`; X.fillText('倒回去看', 420, 520); X.font = `600 26px ${F_C}`; X.letterSpacing = '4px'; X.fillStyle = COL.ink; X.fillText('REWIND', 422, 572);
  X.restore();
}
function dbgMarks(f, clip = 'a') {
  X.save(); X.font = '20px Mono'; X.fillStyle = '#f0f';
  for (const tr of (clip === 'b' ? ['dir', 'zaj', 'bb'] : clip === 'c' ? [] : ['kald', 'ball', 'd26w', 'r3', 'r26', 'rball'])) { const [x, y] = at(tr, f); X.beginPath(); X.arc(x, y, 7, 0, 7); X.fill(); X.fillText(tr, x + 10, y - 10); }
  for (const d of DEF2) { X.fillStyle = '#0ff'; X.beginPath(); X.arc(d[0], d[1], 7, 0, 7); X.fill(); }
  X.strokeStyle = '#fff'; X.lineWidth = 2; if (BOXLINE.length) { path(BOXLINE); X.stroke(); }
  X.fillStyle = '#f00'; X.beginPath(); X.arc(GOALPT[0], GOALPT[1], 9, 0, 7); X.fill();
  X.fillText('F' + f.toFixed(1), 900, 120); X.restore();
}

(async () => {
  TL = await (await fetch('timeline.json')).json();
  try { TL.vdur = await (await fetch('vdur.json')).json(); } catch (e) { TL.vdur = {}; }
  window.DUR = TL.dur;
  // F2 nearest defender (source coordinates → 1920), F3 edge of the box and where the shot lands
  DEF2 = [P(497, 397), P(579, 321)];
  BOXLINE = [P(356, 256), P(565, 348)];
  GOALPT = P(1192, 252);
  PITCH = await (await fetch('assets/pitch.json')).json();
  { // first goal's finishing point: pitch coordinates measured on the g1 frame (F119), converted back to the picture with the perspective matrix of freeze frame F106
    const m = PITCH.g1.marks_m.shot; G1TARGET = Hap(PITCH.g1fz.H, m[0], m[1]); }
  GOALS = [
    { n: 1, min: '55′', from: 0, t: S('g1go').t0 + (125 - 106) / ((S('g1go').f1 - 106) / (S('g1go').t1 - S('g1go').t0)), ring: null },
    { n: 2, min: '61′', from: S('g2split').t0, t: S('g2go').t0 + (57 - 46) / ((S('g2go').f1 - 46) / (S('g2go').t1 - S('g2go').t0)), ring: null },
    { n: 3, min: '67′', from: S('live').t0, t: S('live').t0 + 78 / 25, ring: null }
  ];
  VART = S('g2go').t0 + .95;   // after the ball hits the net (F057)
  await Promise.all([`900 40px ${F_ZH}`, `500 20px ${F_ZH}`, `800 italic 40px ${F_C}`, `600 20px ${F_C}`, `500 20px ${F_M}`, `700 40px ${F_ZH}`].map(f => document.fonts.load(f, '定格A1')));
  STAD = await img('assets/stadium.jpg'); HAK = await img('assets/hak.jpg');
  await img(fsrc(1));
  await render(0);
  window.render = render;
  window.READY = true;
})();
</script></body></html>
