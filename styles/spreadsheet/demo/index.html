<!doctype html>
<html><head><meta charset="utf-8"><title>The Hidden Column · Spreadsheet Film</title>
<style>
@font-face{font-family:'NSC';src:url(fonts/NotoSansSC-sub.woff2) format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Inter';src:url(fonts/Inter-sub.woff2) format('woff2');font-weight:100 900;font-display:block}

</style>

</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Spreadsheet Film · full film: "The Hidden Column" (藏起来的那一列), Simpson's paradox in one sheet.
// Data: Charig et al., BMJ 1986 (kidney stones, open surgery A vs PCNL B), 700 patients, 1 cell = 1 patient.
// Rule of the style: everything on screen is something a sheet can make — fills, values, borders, merged cells,
// hidden columns, reference boxes, the formula bar. The shell never zooms; only the sheet does.
const Q = new URLSearchParams(location.search);
const CUT_FROM = Q.get('from') ? +Q.get('from') : 0, CUT_TO = Q.get('to') ? +Q.get('to') : TL.dur;   // ?from=a&to=b: only [a, b) of the one timeline
const W = 1920, H = 1080, DUR = TL.dur;
const P = TL.p;                                              // phrase start times (from timeline.py)
const cv = document.getElementById('c'), g = cv.getContext('2d');
const UI = "'Inter','NSC',sans-serif";
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const ss = t => t * t * (3 - 2 * t);
const back = t => { const s = 1.6; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t, 0, 1)).toString(16).padStart(2, '0')).join(''); };

// ---------------- palette ----------------
const INK = '#17120a', AMBER = '#ffb21f';
const OK = '#b8f25a', OK_INK = '#2c4a00';              // success (lime)
const NO = '#e8382d', NO_INK = '#ffe0db';              // not successful (red)
const BIG = '#2a2f6c', BIG_INK = 'rgba(255,255,255,0.75)';   // large stone (indigo)
const SMALL = '#dfe6f3', SMALL_INK = '#2a2f6c';        // small stone (pale)
const REF_A = '#2f6fe0', REF_B = '#b03ad6';
const NOTE = '#fff4c7';
const PASTEL = ['#d4f57a', '#fff09a', '#ffc99e', '#ffb3c9', '#b9dcff', '#a8efd5'];

// ---------------- chrome (fixed; only the sheet zooms) ----------------
const TITLE_H = 30, TOOL_H = 40, FBAR_H = 50, ROWH_W = 54, TABS_H = 28, STAT_H = 26;
const SHEET_B = H - TABS_H - STAT_H;
const RH = 22, CWID = 64;                                 // a cell at 100 %: rectangular pixel ≈ 2.9 : 1
const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };

// ---------------- the data (Charig et al. 1986) ----------------
const GROUPS = { A: { S: [81, 87], L: [192, 263] }, B: { S: [234, 270], L: [55, 80] } };   // [successes, patients]
const BLOCK = { A: 2, B: 33 };                            // first column of each block (outcome col; size col is +1)
const ROW0 = 5, PW = 14, PH = 25;                         // patients: 14 pairs wide × 25 rows
const NC = 80;
const isSizeCol = i => (i >= BLOCK.A && i < BLOCK.A + 2 * PW && (i - BLOCK.A) % 2 === 1) || (i >= BLOCK.B && i < BLOCK.B + 2 * PW && (i - BLOCK.B) % 2 === 1);
const PIV = {                                             // pivot bars: first col, width; bottom row
  AS: { tr: 'A', sz: 'S', c0: 12, w: 4 }, BS: { tr: 'B', sz: 'S', c0: 17, w: 12 },
  AL: { tr: 'A', sz: 'L', c0: 33, w: 12 }, BL: { tr: 'B', sz: 'L', c0: 46, w: 4 },
};
const PBOT = 69;
const pats = [];
{
  const rnd = mulberry(1986);
  for (const tr of ['A', 'B']) {
    const list = [];
    for (const sz of ['S', 'L']) { const [ok, n] = GROUPS[tr][sz]; for (let q = 0; q < n; q++) list.push({ tr, sz, ok: q < ok ? 1 : 0 }); }
    for (let q = list.length - 1; q > 0; q--) { const r = Math.floor(rnd() * (q + 1)); [list[q], list[r]] = [list[r], list[q]]; }
    list.forEach((p, k) => { p.hc = BLOCK[tr] + 2 * (k % PW); p.hr = ROW0 + Math.floor(k / PW); p.sc = p.hc + 1; p.id = k + 1; pats.push(p); });
  }
  // destinations: each bar fills bottom-up, successes first, failures on top
  for (const key in PIV) {
    const b = PIV[key], mem = pats.filter(p => p.tr === b.tr && p.sz === b.sz).sort((x, y) => y.ok - x.ok || x.hr - y.hr || x.hc - y.hc);
    b.n = mem.length; b.ok = mem.filter(p => p.ok).length; b.top = PBOT - Math.ceil(b.n / b.w) + 1;
    mem.forEach((p, m) => { p.dc = b.c0 + (m % b.w); p.dr = PBOT - Math.floor(m / b.w); p.m = m; p.bar = key; });
  }
}
const homeMap = new Map(); pats.forEach(p => homeMap.set(p.hc + ',' + p.hr, p));
const sizeMap = new Map(); pats.forEach(p => sizeMap.set(p.sc + ',' + p.hr, p));

// ---------------- merged cells ----------------
const M = {
  LBL_A: [BLOCK.A, BLOCK.A + 27, 2, 3], LBL_B: [BLOCK.B, BLOCK.B + 27, 2, 3],
  RL_A: [BLOCK.A, BLOCK.A + 17, 31, 32], RV_A: [BLOCK.A + 18, BLOCK.A + 27, 31, 32],
  RL_B: [BLOCK.B, BLOCK.B + 17, 31, 32], RV_B: [BLOCK.B + 18, BLOCK.B + 27, 31, 32],
  TITLE: [12, 49, 40, 42],
  ROOM_S: [12, 28, 44, 45], ROOM_L: [33, 49, 44, 45],
  TOT: [12, 49, 74, 75],
  CNT_A: [BLOCK.A, BLOCK.A + 27, 34, 37], CNT_B: [BLOCK.B, BLOCK.B + 27, 34, 37],
  CARD: [18, 43, 80, 93],
};
for (const k in PIV) { const b = PIV[k]; M['BL_' + k] = [b.c0, b.c0 + b.w - 1, 70, 70]; M['RT_' + k] = [b.c0, b.c0 + b.w - 1, 71, 72]; }
const PATIENT_DEMO = pats.find(p => p.tr === 'A' && p.hr === 12 && p.hc === BLOCK.A + 10 && true) || pats[150];

// ---------------- timing ----------------
const T = {
  a0: 0.3, a1: 1.7, enterA: 2.0, hop0: 2.15, hop1: 2.7, b0: 2.85, b1: 3.8, enterB: 4.0, winB: 4.45,
  pull0: 7.5, pull1: 10.0, paint0: 7.9, paint1: 9.85,
  pdHop0: 10.75, pdHop1: 11.25, pdNote: 11.35,
  quiet: 14.55, whip0: 15.0, whip1: 15.45, track1: 17.2,
  selAll: 17.45, rclick: 17.95, menuHi: 18.25, unhide: 18.55, un1: 19.85,
  cnt0: 21.9, cnt1: 22.7, cntEnter: 22.95,
  pv0: 24.85, pv1: 26.2, pvEnter: 26.45, fly0: 26.55, fly1: 29.0,
  rateS_A: P.v09_1 + 0.62, rateS_B: P.v09_1 + 1.72, rateL_A: P.v10_1 + 0.55, rateL_B: P.v10_1 + 1.72,
  tot: 38.75, w0: 39.75, w1: 40.75, wEnter: 40.95, totWin: P.v11_1 + 0.1,
  ti0: P.v12_0 + 0.05, ti1: P.v12_0 + 0.95, tiEnter: P.v12_0 + 1.1,
  bloom: 44.95, card0: 48.6, card1: 49.15,
};
T.winS = T.rateS_B + 0.55; T.winL = T.rateL_B + 0.55;
const EV = [];
// paint order: rings from each block's result cell
const RC = { A: { c: BLOCK.A + 22, r: 31.5 }, B: { c: BLOCK.B + 22, r: 31.5 } };
pats.forEach(p => { const c = RC[p.tr]; const d = Math.max(Math.abs(p.hc - c.c) / 2, Math.abs(p.hr - c.r) * 0.95); p.tp = T.paint0 + d * 0.072 + hash(p.hc, p.hr) * 0.05; });
// flight order: bars build bottom-up, left room first by a hair
pats.forEach(p => { const rank = (PBOT - p.dr) + (p.dc - 12) * 0.012 + hash(p.dc, p.dr) * 0.9; p.rk = rank; });
{ const mx = Math.max(...pats.map(p => p.rk)); pats.forEach(p => { p.f0 = T.fly0 + (p.rk / mx) * (T.fly1 - T.fly0 - 0.55); p.f1 = p.f0 + 0.55; }); }
// hidden columns open as a ripple, left → right
const UNC = []; for (let i = 0; i < NC; i++) if (isSizeCol(i)) UNC.push(i);
const unT = {}; UNC.forEach((i, q) => { unT[i] = T.unhide + 0.08 + q * (T.un1 - T.unhide - 0.6) / UNC.length; EV.push({ t: +unT[i].toFixed(4), type: 'unhide', n: q }); });

// ---------------- column layout (the hidden columns change it) ----------------
let CX = new Float64Array(NC + 2), CWs = new Float64Array(NC + 1);
function layout(t) {
  let x = 0;
  for (let i = 0; i <= NC; i++) {
    let w = CWID;
    if (i < NC && isSizeCol(i)) w = CWID * eio(seg(t, unT[i], unT[i] + 0.55));
    CWs[i] = w; CX[i] = x; x += w;
  }
  CX[NC + 1] = x;
}
const colX = i => i <= NC ? CX[Math.max(0, i)] : CX[NC] + (i - NC) * CWID;
const colW = i => i < NC ? CWs[Math.max(0, i)] : CWID;
const colXf = c => { const i = Math.floor(c); return colX(i) + (c - i) * colW(i); };

// ---------------- camera ----------------
const mid = k => { const [c0, c1, r0, r1] = M[k]; return [(c0 + c1 + 1) / 2, (r0 + r1 + 1) / 2]; };
const CK = [   // t, centre [col, row] (col in column units, so the camera rides the unhide), zoom, ease into this key
  { t: 0.0, at: [M.RV_A[0] + 6.2, 30.2], z: 2.85 },
  { t: 1.9, at: [M.RV_A[0] + 6.0, 30.0], z: 2.7, e: 'ss' },
  { t: T.hop0, at: [M.RV_A[0] + 6.0, 30.0], z: 2.7 },
  { t: T.hop1 + 0.15, at: [M.RV_B[0] + 6.0, 30.0], z: 2.7, e: 'eio' },
  { t: 4.6, at: [M.RV_B[0] + 5.7, 30.2], z: 2.85, e: 'ss' },
  { t: 5.7, at: [31.5, 28.6], z: 1.12, e: 'eio' },
  { t: T.pull0, at: [31.5, 28.2], z: 1.06, e: 'ss' },
  { t: T.pull1, at: [31.5, 17.6], z: 0.79, e: 'eio' },
  { t: 14.55, at: [24.5, 15.2], z: 0.95, e: 'ss' },
  { t: T.whip0, at: [24.0, 14.8], z: 0.97, e: 'ss' },
  { t: T.whip1, at: [9.5, 7.6], z: 2.05, e: 'eio' },
  { t: T.track1, at: [23.5, 7.6], z: 2.05, e: 'ss' },
  { t: T.unhide + 0.1, at: [23.5, 7.6], z: 2.05 },
  { t: T.un1 + 0.5, at: [31.5, 17.0], z: 0.475, e: 'eio' },
  { t: T.pv0, at: [31.5, 17.2], z: 0.485, e: 'ss' },
  { t: T.pvEnter + 0.1, at: [31.5, 20.0], z: 0.48, e: 'ss' },
  { t: T.fly1 + 0.15, at: [31.0, 58.0], z: 0.74, e: 'eio' },
  { t: T.rateS_A - 1.3, at: [20.5, 58.6], z: 1.1, e: 'eio' },
  { t: T.winS + 0.6, at: [20.5, 58.6], z: 1.13, e: 'ss' },
  { t: T.rateL_A - 1.25, at: [41.5, 58.6], z: 1.1, e: 'eio' },
  { t: T.winL + 0.5, at: [41.5, 58.6], z: 1.13, e: 'ss' },
  { t: T.tot + 0.75, at: [31.0, 58.4], z: 0.745, e: 'eio' },
  { t: T.bloom, at: [31.0, 58.2], z: 0.76, e: 'ss' },
  { t: 47.55, at: [31.5, 50.0], z: 0.36, e: 'eio' },
  { t: 48.75, at: [31.0, 87.0], z: 1.0, e: 'eio' },
  { t: DUR, at: [31.0, 87.0], z: 1.03, e: 'ss' },
];
const EASE = { eio, ss, eo, lin: x => x };
let CAM, HDR, SHEET_Y, VCX, VCY, VW, VH;
function camera(t) {
  let q = 0; while (q < CK.length - 2 && t > CK[q + 1].t) q++;
  const A = CK[q], B = CK[q + 1], u = (EASE[B.e] || EASE.lin)(seg(t, A.t, B.t));
  const z = Math.exp(lerp(Math.log(A.z), Math.log(B.z), u));
  // interpolate in screen-consistent terms: blend the world centres
  const ax = colXf(A.at[0]), ay = A.at[1] * RH, bx = colXf(B.at[0]), by = B.at[1] * RH;
  // zoom-aware path: keep the motion from overshooting by weighting with 1/z
  const wA = 1 / A.z, wB = 1 / B.z, k = (lerp(0, wB, u) * 0 + u);
  return { x: lerp(ax, bx, k), y: lerp(ay, by, k), z };
}
const X = wx => VCX + (wx - CAM.x) * CAM.z, Y = wy => VCY + (wy - CAM.y) * CAM.z;
const XC = i => Math.round(X(colX(i))), YR = j => Math.round(Y(j * RH));

// ---------------- helpers ----------------
const rect = (x, y, w, h, f) => { g.fillStyle = f; g.fillRect(x, y, w, h); };
function text(s, x, y, font, col, align = 'left', base = 'middle') { g.font = font; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
const line = (x1, y1, x2, y2, col, w = 1) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
const tw = (s, font) => { g.font = font; return g.measureText(s).width; };
function mrect(k) { const [c0, c1, r0, r1] = M[k]; const x = XC(c0), y = YR(r0); return [x, y, XC(c1 + 1) - x, YR(r1 + 1) - y]; }
function typed(s, t, a, b) { if (t < a) return ''; if (t >= b) return s; return [...s].slice(0, Math.floor(seg(t, a, b) * [...s].length + 1e-6)).join(''); }
function addKeys(s, a, b) { const n = [...s].length; for (let q = 0; q < n; q++) EV.push({ t: +(a + (b - a) * q / n).toFixed(4), type: 'key' }); }
function refBox(x, y, w, h, col, lw = 2.5) {
  g.lineWidth = lw; g.strokeStyle = col; g.strokeRect(x + 1, y + 1, w - 1, h - 1);
  g.fillStyle = col; for (const [a, b] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) g.fillRect(a - 3.5, b - 3.5, 7, 7);
}
const popK = (t, t0, d = 0.2, amt = 0.3) => t >= t0 && t < t0 + d ? 1 + amt * (1 - (t - t0) / d) : 1;

// ---------------- formulas (the film's dialogue lines) ----------------
const FX_A = [['=AVERAGE(', INK], ['A_outcome', REF_A], [')', INK]];
const FX_B = [['=AVERAGE(', INK], ['B_outcome', REF_B], [')', INK]];
const FX_C = [['=COUNTIF(', INK], ['A_size', BIG], [', "L")', INK]];
const FX_P = [['=PIVOTBY(', INK], ['size', BIG], [', ', INK], ['treatment', '#555'], [', ', INK], ['outcome', '#3f8a00'], [', AVERAGE)', INK]];
const FX_W = [['=(', INK], ['87', REF_A], ['*', INK], ['93%', REF_A], [' + ', INK], ['263', REF_B], ['*', INK], ['73%', REF_B], [') / 350', INK]];
const flat = parts => parts.flatMap(([s, c]) => [...s].map(ch => [ch, c]));
const FXs = { A: flat(FX_A), B: flat(FX_B), C: flat(FX_C), P: flat(FX_P), W: flat(FX_W) };
const TITLE_S = "Simpson's paradox", TITLE_Z = '辛普森悖论', CARD_S = 'The Hidden Column';
function typedParts(key, t, a, b) { const L = FXs[key]; if (t >= b) return L; return L.slice(0, Math.floor(seg(t, a, b) * L.length + 1e-6)); }
addKeys(FXs.A, T.a0, T.a1); addKeys(FXs.B, T.b0, T.b1); addKeys(FXs.C, T.cnt0, T.cnt1); addKeys(FXs.P, T.pv0, T.pv1); addKeys(FXs.W, T.w0, T.w1);
addKeys(TITLE_S, T.ti0, T.ti1); addKeys(CARD_S, T.card0, T.card1);
for (const [t, n] of [[T.enterA, 1], [T.enterB, 2], [T.cntEnter, 3], [T.pvEnter, 4], [T.wEnter, 5], [T.tiEnter, 6], [T.card1 + 0.1, 7]]) EV.push({ t, type: 'enter', n });

// ---------------- selection (the amber active cell) ----------------
const hopPath = (a, b, n, t0, t1) => { const o = []; for (let q = 0; q <= n; q++) { const u = q / n; o.push({ c: Math.round(lerp(a.c, b.c, u)), r: Math.round(lerp(a.r, b.r, u)), t: t0 + (t1 - t0) * u }); } return o; };
const HOP_AB = hopPath({ c: M.RV_A[1], r: 31 }, { c: M.RV_B[0], r: 31 }, 7, T.hop0, T.hop1);
const HOP_PD = hopPath({ c: M.RV_B[0], r: 31 }, { c: PATIENT_DEMO.hc, r: PATIENT_DEMO.hr }, 9, T.pdHop0, T.pdHop1);
for (const h of [...HOP_AB.slice(1), ...HOP_PD.slice(1)]) EV.push({ t: +h.t.toFixed(4), type: 'hop' });
function selection(t) {  // → {box:[c0,c1,r0,r1] | null, editing, trail}
  const walk = hops => { let p = hops[0]; for (const h of hops) if (t >= h.t) p = h; return { p, trail: hops.filter(h => h.t <= t && t - h.t < 0.22 && (h.c !== p.c || h.r !== p.r)) }; };
  if (t < T.hop0) return { box: M.RV_A, editing: t < T.enterA };
  if (t < T.hop1) { const w = walk(HOP_AB); return { box: [w.p.c, w.p.c, 31, 32], trail: w.trail }; }
  if (t < T.pdHop0) return { box: M.RV_B, editing: t >= T.b0 && t < T.enterB };
  if (t < T.selAll) { const w = walk(HOP_PD); const p = w.p; return { box: [p.c, p.c, p.r, p.r], trail: w.trail.map(h => ({ ...h, r1: h.r })), small: true }; }
  if (t < T.cnt0) return { box: null };
  if (t < T.pv0) return { box: M.CNT_A, editing: t < T.cntEnter };
  if (t < T.rateS_A - 0.2) return { box: M.ROOM_S, editing: t < T.pvEnter };
  if (t < T.rateL_A - 0.2) return { box: M['RT_AS'] };
  if (t < T.w0) return { box: M['RT_AL'] };
  if (t < T.ti0) return { box: [30, 37, 74, 75], editing: t < T.wEnter };
  if (t < T.bloom) return { box: M.TITLE, editing: t < T.tiEnter };
  if (t < T.card0 - 0.15) return { box: null };
  return { box: M.CARD, editing: t < T.card1 + 0.1 };
}

// ---------------- background: white sheet, enter pulses, and the final bloom ----------------
const BLOOM_C = { c: 30.5, r: 41 };
const PULSES = [{ t: T.enterA, c: M.RV_A[0] + 5, r: 31.5, col: 1 }, { t: T.enterB, c: M.RV_B[0] + 5, r: 31.5, col: 4 }, { t: T.pvEnter, c: 20, r: 44.5, col: 0 }, { t: T.tiEnter, c: 30.5, r: 41, col: 3 }];
function bloomAt(i, j, t) {
  if (t < T.bloom) return null;
  const d = Math.max(Math.abs(i + 0.5 - BLOOM_C.c) * 0.62, Math.abs(j + 0.5 - BLOOM_C.r));
  const tr = T.bloom + d * 0.032 + hash(i, j) * 0.04;
  if (t < tr) return null;
  const step = Math.floor(d / 2.2);
  return { fill: PASTEL[step % PASTEL.length], val: String(10 + (step % 6) * 17), tr };
}

// ---------------- drawing the sheet ----------------
function drawSheet(t) {
  const z = CAM.z, ch = RH * z;
  g.save(); g.beginPath(); g.rect(ROWH_W, SHEET_Y, VW, VH); g.clip();
  rect(ROWH_W, SHEET_Y, VW, VH, '#ffffff');
  // visible columns
  const xl = CAM.x - (VCX - ROWH_W) / z, xr = CAM.x + (W - VCX) / z;
  let i0 = 0; while (i0 < NC && colX(i0 + 1) < xl) i0++;
  let i1 = i0; while (colX(i1) < xr && i1 < NC + 40) i1++;
  const j0 = Math.max(0, Math.floor((CAM.y - (VCY - SHEET_Y) / z) / RH)), j1 = Math.ceil((CAM.y + (SHEET_B - VCY) / z) / RH);
  const fs = 11 * z, showVal = fs >= 6.5;
  const light = new Path2D(), dark = new Path2D();
  const valFont = `500 ${fs}px ${UI}`;
  const flying = [];
  for (let i = i0; i <= i1; i++) {
    const cw = colW(i); if (cw < 0.5) continue;
    const x = XC(i), w = XC(i + 1) - x;
    for (let j = j0; j <= j1; j++) {
      const y = YR(j), h = YR(j + 1) - y;
      let fill = null, val = '', ink = '#9a9a94', painted = false, flash = 0;
      const key = i + ',' + j;

  if (t >= T.pvEnter + 0.25) { put('roomS', 'Small stones < 2 cm', 'ROOM_S'); put('roomL', 'Large stones ≥ 2 cm', 'ROOM_L'); }
  for (const [k, tr, pct] of [['AS', T.rateS_A, '93%'], ['BS', T.rateS_B, '87%'], ['AL', T.rateL_A, '73%'], ['BL', T.rateL_B, '69%']]) if (t >= tr) put('rate' + k, pct, 'RT_' + k);
  if (t >= T.tot + 0.3) put('total', 'All 700 patients, together A 78% B 83%', 'TOT');
  if (t >= T.tiEnter) put('title', "Simpson's paradox 辛普森悖论", 'TITLE');
  if (t >= T.card0) put('cardTitle', 'The Hidden Column', 'CARD');                 // the end card's four blocks: title (typed),
  if (t >= T.card0 + 0.15) {                                                        // Chinese title, style name and sign-off (faded in)
    put('cardZh', '藏起来的那一列', 'CARD'); put('cardStyle', 'Spreadsheet Film · 表格动画', 'CARD'); put('cardSign', 'LemoLab × Claude Opus 5.5', 'CARD');
  }
  if (t >= T.pdNote && t < T.quiet) {
    const p = PATIENT_DEMO, ax = XC(p.hc + 1), ay = YR(p.hr);
    out.push({ id: 'note', text: `Patient ${p.id} Treatment A · success Stone size: not shown`, x0: ax + 40, y0: ay - 128, x1: ax + 370, y1: ay - 16 });
  }
  return out;
};
Promise.all([
  document.fonts.load(`500 20px NSC`, '藏起来的那一列'), document.fonts.load(`700 20px NSC`, '辛普森悖论'),
  document.fonts.load(`500 20px Inter`, 'Ab12'), document.fonts.load(`800 20px Inter`, 'Ab12'), document.fonts.load(`italic 500 20px Inter`, 'I'),
]).then(() => document.fonts.ready).then(() => { window.render(0); window.READY = true; });
</script></body></html>
