<!doctype html>
<html><head><meta charset="utf-8"><title>山海 · Mountains and Seas</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// 《山海》 Mountains and Seas, 50.5 s. Double exposure: animal silhouettes (PhyloPic CC0 / PD) used as windows onto CC0 photographs.
// stag / dusk ridge -> (through the window) wolf / misty forest -> (whip) eagle / snow peaks -> (dive, screen dissolve)
// salmon / river town underwater -> (the two whole silhouettes superimposed, screen blend) humpback / harbour -> (breach) whale over the night sea -> register on the shore.
// WebGL2: each shot is one full-screen shader pass into a float FBO, then a composite pass. Everything is a pure function of t.
import { clamp, lerp, seg, ss, eio, eo, ei, mulberry } from '/core/lib.js';

const W = innerWidth || 1920, H = innerHeight || 1080, SC = W / 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const load = src => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(new Error('load ' + src)); i.src = src; });
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------- GL plumbing
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n')); return s; }
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
function tex(src, opt = {}) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  if (opt.nomip) { gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); }
  else { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, opt.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, opt.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  return t;
}
function fbo() {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { f, t };
}

// ---------------------------------------------------------------- shared GLSL
const COMMON = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes; uniform float uT;
uniform vec4 uCam;          // world centre x,y, zoom, roll
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float a=0., m=.5; for(int i=0;i<5;i++){ a+=m*vn(p); p=p*2.03+vec2(1.7,9.2); m*=.5; } return a; }
float fbm3(vec2 p){ float a=0., m=.5; for(int i=0;i<3;i++){ a+=m*vn(p); p=p*2.03+vec2(1.7,9.2); m*=.5; } return a; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
vec2 P(){ vec2 p = gl_FragCoord.xy / uRes * vec2(1920.,1080.); p.y = 1080.-p.y; return p; }   // design pixels, y down
vec2 Wc(vec2 p, float d, vec4 cam){ float z = 1. + (cam.z-1.)*d; vec2 c = vec2(960.,540.) + (cam.xy-vec2(960.,540.))*d;
  return c + rot(cam.w)*(p-vec2(960.,540.))/z; }
vec2 W(vec2 p, float d){ return Wc(p, d, uCam); }
float zoomAt(float d){ return 1. + (uCam.z-1.)*d; }
vec2 Sc(vec2 w, float d){ float z = 1. + (uCam.z-1.)*d; vec2 c = vec2(960.,540.) + (uCam.xy-vec2(960.,540.))*d;
  return vec2(960.,540.) + rot(-uCam.w)*((w-c)*z); }
// silhouette mask: texture R = sharp alpha, G = blurred alpha, B = signed distance (0.5 = edge). xf = (x, y, height, angle), asp = tex w/h
vec2 silUV(vec2 w, vec4 xf, float asp){ vec2 l = rot(-xf.w)*(w-xf.xy)/xf.z; return vec2(l.x/asp + .5, l.y + .5); }
vec2 sampleMask(sampler2D m, vec2 uv){ vec2 s = textureLod(m, clamp(uv, 0., 1.), 0.).rg; float in_ = step(0., uv.x)*step(0., uv.y)*step(uv.x, 1.)*step(uv.y, 1.); return s*in_; }
vec3 sampleMask3(sampler2D m, vec2 uv){ vec3 s = textureLod(m, clamp(uv, 0., 1.), 0.).rgb; float in_ = step(0., uv.x)*step(0., uv.y)*step(uv.x, 1.)*step(uv.y, 1.); return mix(vec3(0.,0.,1.), s, in_); }
float photo(sampler2D t, vec2 w, vec4 r){ vec2 uv = (w - r.xy)/r.zw + .5; return texture(t, clamp(uv, 0., 1.)).r; }
vec3 photoC(sampler2D t, vec2 w, vec4 r){ vec2 uv = (w - r.xy)/r.zw + .5; return texture(t, clamp(uv, 0., 1.)).rgb; }
// a whale swims with its body: a vertical wave travelling head -> tail, growing toward the flukes, which pitch with it
vec2 whaleWarp(vec2 uw, float asp, float tail, float ph, float amp){
  vec2 q = (uw - vec2(.74, .5))*vec2(abs(asp),1.);
  vec2 r = (rot(tail*smoothstep(.0, .6, q.x)*1.2)*q)/vec2(abs(asp),1.) + vec2(.74,.5);
  r.y += amp*pow(smoothstep(.18, 1., r.x), 1.6)*sin(ph - 4.4*r.x);
  return r;
}
uniform float uWPh, uWA;
const vec3 WARM = vec3(1., .63, .32);
uniform vec4 uL[40]; uniform int uLN;  // warm lights: x, y (in layer world), radius, intensity
vec3 lights(vec2 wl, float zl){
  vec3 c = vec3(0.);
  for(int i=0;i<40;i++){ if(i>=uLN) break; vec4 L = uL[i]; if(L.w<=0.) continue;
    vec2 d = wl - L.xy; float r2 = dot(d,d);
    float core = exp(-r2/(L.z*L.z*.035)); float glow = exp(-r2/(L.z*L.z)) ;
    c += L.w*(WARM*glow*.55 + vec3(1.,.86,.62)*core*1.4); }
  return c;
}
`;

// ---------------------------------------------------------------- shot 1: stag on a dusk ridge (develop, then push through the window)
const FS0 = COMMON + `
uniform sampler2D uMask, uForest;
uniform vec4 uSil; uniform float uAsp, uDev, uHead, uMixB;
uniform vec4 uCamB; uniform vec2 uRef, uAnchor;
void main(){
  vec2 p = P();
  vec2 w = W(p, 1.), wb = W(p, .2), wh = W(p, .5), wm = W(p, .8);
  // high-key dusk sky, a low white sun behind the far hills
  float v = wb.y/1080.;
  float cl = fbm(wb/vec2(760.,150.) + vec2(uT*.025, 0.)), cl2 = fbm(wb/vec2(320.,70.) + vec2(uT*.05, 4.));
  float sky = mix(.93, .62, smoothstep(.8, .0, v)) + (cl-.5)*.1 - smoothstep(.55,.8,cl2)*.07*smoothstep(.75,.25,v);
  vec2 sp = vec2(430., 742. + uT*7.); float ds = length(wb - sp);
  sky += .12*exp(-ds/420.) + .08*exp(-ds/110.);
  sky = mix(sky, 1.02, smoothstep(40., 37., ds));
  vec3 col = vec3(sky);
  // two ranges of far hills, mist between
  float h1 = 790. + (fbm3(vec2(wh.x/460., 1.))-.5)*190.;
  col = mix(col, vec3(.72), smoothstep(h1, h1+3., wh.y)*.8);
  col = mix(col, vec3(.86), smoothstep(.48,.78, fbm(wh/vec2(380.,60.) + vec2(uT*.06, 2.)))*smoothstep(h1-60., h1+80., wh.y)*.6);
  float h2 = 880. + (fbm3(vec2(wm.x/300., 7.))-.5)*120.;
  col = mix(col, vec3(.5), smoothstep(h2, h2+3., wm.y)*.85);
  col = mix(col, vec3(.8), smoothstep(.5,.8, fbm(wm/vec2(300.,50.) + vec2(uT*.1, 9.)))*smoothstep(h2-40., h2+60., wm.y)*.55);
  // the stag: head lifts about the neck
  vec2 uv = silUV(w, uSil, uAsp);
  vec2 piv = vec2(.60, .47); float hw = smoothstep(.50,.36,uv.y) * smoothstep(.50,.60,uv.x);
  vec2 uvh = piv + rot(uHead*hw)*((uv-piv)*vec2(uAsp,1.))/vec2(uAsp,1.);
  uvh.y += .006*sin(uT*2.1)*smoothstep(.3,.5,uvh.y)*smoothstep(.72,.55,uvh.y);      // breathing
  uvh.x += .009*sin(uT*1.35)*smoothstep(.6,.95,uvh.y);                             // weight shifts across the legs
  uvh.x += .004*sin(uT*1.35 + 1.)*smoothstep(.45,.2,uvh.y)*smoothstep(.5,.62,uvh.x); // head bobs with the step
  vec2 m = sampleMask(uMask, uvh);
  // inside: the misty forest, in forest-layer coordinates; at the end of the push it is exactly the wolf shot's first frame
  vec2 fwA = uAnchor + (W(p, .22) - uRef);
  vec2 fwB = Wc(p, .7, uCamB);
  vec2 fw = mix(fwA, fwB, uMixB);
  float f = photo(uForest, fw, vec4(1050., 260., -2300., 1533.));
  float inside = mix(.05 + .86*pow(f, 1.45), .04 + .72*pow(f, 1.7), uMixB);
  inside *= mix(.5, 1., smoothstep(.04, .32, uvh.y)*(1.-uMixB) + uMixB);       // antlers print darker
  inside *= mix(.42 + .58*smoothstep(.3, 1., m.g), 1., uMixB);
  inside += .05*(fbm(fw/90. + vec2(uT*.25,0.))-.5);
  float fog = fbm(fw/vec2(330.,90.) + vec2(uT*.22, 0.));
  inside = mix(inside, .87, smoothstep(.46,.78,fog)*smoothstep(.45,.75, fw.y/1080.)*.6);
  // develop: the photograph prints into the dark shape from the hooves up
  float front = mix(1.1, -.15, uDev);
  float dv = smoothstep(front, front + .2, uvh.y);
  float ins = mix(.07, inside, dv) + .06*exp(-pow((uvh.y - front - .1)/.05, 2.))*step(.01, uDev)*(1.-uDev);
  col += vec3(.06)*m.g*(1.-m.r)*(1.-uMixB);                                 // soft halo lifts the shape off the sky
  col = mix(col, vec3(ins), max(m.r, uMixB));
  col += lights(fw, 1.) * max(m.r, uMixB) * dv;
  // the ridge he stands on, with grass moving in the wind
  float gy = 936. - (w.x - 1150.)*.06 + (fbm3(vec2(w.x/210., 3.))-.5)*34.;
  float cx = floor(w.x/6.); float hb = hash(vec2(cx, 2.)); float bh = 10. + 34.*hb*hb;
  float sway = sin(uT*1.6 + cx*.13)*6.*hb;
  float yy = (gy - w.y)/bh;                                                 // 0 at ground, 1 at tip
  float blade = step(0., yy)*step(yy, 1.)*step(abs(fract(w.x/6.) - .5 - sway*yy/6.), .22*(1.-yy)+.06);
  float ground = smoothstep(gy-1., gy+1., w.y);
  col = mix(col, vec3(.08), max(ground, blade)*(1.-uMixB));
  o = vec4(col, 1.);
}`;

// ---------------------------------------------------------------- shot 2: wolf / misty forest
const FS1 = COMMON + `
uniform sampler2D uMask, uForest, uPine;
uniform vec4 uSil; uniform float uAsp, uHowl, uMoonFlare, uHead;
void main(){
  vec2 p = P();
  vec2 w = W(p, 1.), wb = W(p, .35), wf = W(p, .7), wg = W(p, 1.45);
  float cl = fbm(wb/vec2(520.,200.) + vec2(uT*.05, 0.)), cl2 = fbm(wb/vec2(240.,110.) + vec2(uT*.09, 3.));
  float v = wb.y/1080.;
  float sky = mix(.84, .5, smoothstep(.0,.62,1.-v)) - smoothstep(.42,.8,cl)*.3*smoothstep(.7,0.,v) + (cl2-.5)*.09;
  vec2 mp = vec2(1430., 250.); float dm = length(wb-mp);
  sky += (.28 + .25*uMoonFlare)*exp(-dm/(200.+90.*uMoonFlare)) + .42*smoothstep(48.,44.,dm);
  float ridge = 860. + (fbm3(vec2(wb.x/380., 2.))-.5)*160.;
  sky = mix(sky, .52, smoothstep(ridge, ridge+4., wb.y)*.8);
  vec3 col = vec3(sky);
  vec2 uv = silUV(w, uSil, uAsp);
  vec2 piv = vec2(.30, .40); float hw = smoothstep(.46,.30,uv.y) * smoothstep(.55,.32,uv.x);
  vec2 uvh = piv + rot(uHead*hw)*((uv-piv)*vec2(uAsp,1.))/vec2(uAsp,1.);
  uvh.y += .005*sin(uT*2.4)*smoothstep(.35,.55,uvh.y)*smoothstep(.85,.6,uvh.y);      // breathing
  vec2 m = sampleMask(uMask, uvh);
  float f = photo(uForest, wf, vec4(1050., 260., -2300., 1533.));
  float inside = .04 + .72*pow(f, 1.7);
  inside *= mix(.45, 1., smoothstep(.05, .5, uvh.y));
  inside *= .42 + .58*smoothstep(.3, 1., m.g);
  inside += .05*(fbm(wf/90. + vec2(uT*.25,0.))-.5);
  vec2 wt = W(p, .85);
  float tall = texture(uPine, clamp((wt - vec2(-240., -40.))/vec2(2400., 1300.), 0., 1.)).b;
  float haze = smoothstep(60., 560., wt.y);
  inside = mix(inside, mix(.36, .1, haze), tall*.75);
  col = mix(col, vec3(inside), m.r);
  float fog = fbm(wf/vec2(330.,90.) + vec2(uT*.22, 0.));
  float fogY = smoothstep(.45,.75, wf.y/1080.);
  col = mix(col, vec3(.87), smoothstep(.46,.78,fog)*fogY*.66);
  vec4 pn = texture(uPine, clamp((w - vec2(-240., -40.))/vec2(2400., 1300.), 0., 1.), 1.3);
  col = mix(col, vec3(.13), pn.r*.9);
  col = mix(col, vec3(.84), smoothstep(.5,.8,fbm(w/vec2(250.,60.)+vec2(uT*.3,5.)))*smoothstep(.82,.95,w.y/1080.)*.45);
  vec4 pf = texture(uPine, clamp((wg - vec2(-240., -40.))/vec2(2400., 1300.), 0., 1.));
  col = mix(col, vec3(.04), pf.g);
  col += lights(wf, zoomAt(.7)) * m.r * (1.-pf.g);
  col += WARM*.09*uHowl*m.r*smoothstep(.3,.9,f);
  o = vec4(col, 1.);
}`;

// ---------------------------------------------------------------- shot 3: eagle / snow mountains
const FS2 = COMMON + `
uniform sampler2D uMask, uMount;
uniform vec4 uSil; uniform float uAsp, uFlap, uFold;
void main(){
  vec2 p = P();
  vec2 w = W(p, 1.), wb = W(p, .3), wm = W(p, .3), wc = W(p, 1.9);
  float v = wb.y/1080.;
  float cl = fbm(wb/vec2(600.,230.) + vec2(uT*.06, 0.)), cl2 = fbm(wb/vec2(300.,120.) + vec2(uT*.12, 7.));
  float sky = mix(.5, .22, smoothstep(.0,.9,1.-v)) + (cl-.5)*.32 + (cl2-.5)*.12;
  sky += .18*exp(-length(wb-vec2(400.,820.))/500.);
  vec3 col = vec3(sky);
  vec2 uv = silUV(w, uSil, uAsp);
  vec2 q = (uv - vec2(.5, .3))*vec2(uAsp, 1.);
  float side = sign(q.x); float ax = abs(q.x);
  float wing = smoothstep(.07, .16, ax);
  float ang = (uFlap*(1. + .8*smoothstep(.2, 1.2, ax)) ) * wing;
  vec2 sp = vec2(side*.1, -.02);
  vec2 qq = q;
  if (wing > 0.) { qq = sp + rot(-side*ang)*(q - sp); qq.x = side*(.1 + (abs(qq.x)-.1)*(1. + uFold)); }
  vec2 uvw = qq/vec2(uAsp,1.) + vec2(.5,.3);
  vec2 m = sampleMask(uMask, uvw);
  float mt = photo(uMount, wm, vec4(980., 330., 2300., 1533.));
  float inside = .04 + .96*pow(mt, 1.45);
  inside *= .72 + .28*smoothstep(.35, 1., m.g);
  col = mix(col, vec3(inside), m.r);
  col += lights(wm, zoomAt(.3)) * m.r;
  float wf = fbm(wc/vec2(420.,140.) + vec2(uT*.4, 1.));
  col = mix(col, vec3(.8), smoothstep(.58,.82,wf)*.55);
  for (int k=0;k<2;k++){
    float dk = 1.7 + float(k)*1.1; vec2 ws2 = W(p, dk) + vec2(uT*(700.+float(k)*600.), uT*90.);
    vec2 cs = vec2(150., 60.); vec2 cell = floor(ws2/cs); vec2 fr = fract(ws2/cs) - .5;
    float h = hash(cell + float(k)*17.);
    if (h > .86) { vec2 c2 = vec2(hash(cell+3.)-.5, hash(cell+7.)-.5)*vec2(.3,.6); vec2 d2 = fr - c2;
      float br = hash(cell+11.);
      float streak = exp(-pow(d2.y*cs.y/(1.6+float(k)*1.4), 2.)) * smoothstep(.22+.15*br, 0., abs(d2.x));
      col += vec3(.9)*streak*(.18 + .25*br + .15*float(k)); }
  }
  o = vec4(col, 1.);
}`;

// ---------------------------------------------------------------- shot 4: salmon / river town, underwater; morphs into the humpback
const FS4 = COMMON + `
uniform sampler2D uMaskF, uMaskW, uTown, uCity;
uniform vec4 uSilF, uSilW; uniform float uAspF, uAspW, uMorph, uSea, uTail, uSwim, uFAv, uFYaw, uFFin, uSweep, uSweepOn;
uniform vec4 uTownR, uCityR;
const float SY = 40.;
// salmon skeleton along the body axis (mask uv): head at u = .10, tail tip at u = .90, spine at v = .555.
// Carangiform swimming: the head barely moves, a wave runs head -> tail with amplitude growing toward the tail,
// the caudal fin lags. Seen from the side the sideways sway shows as foreshortening of the rear body and the tail fin
// (it narrows as it turns away), plus a small vertical bend of the spine so the travelling wave reads.
const float FUH = .10, FUT = .90, FV0 = .555, TAU = 6.28318;
float fEnv(float s){ return .03 + .97*s*s; }
float fBend(float s){ return uFAv*fEnv(s)*sin(uSwim - TAU*s); }
float fBendD(float s){ return uFAv*(1.94*s*sin(uSwim - TAU*s) - fEnv(s)*TAU*cos(uSwim - TAU*s)); }
float fYaw(float s){ float fin = smoothstep(.78, .9, s); return uFYaw*s*s*(1. + .7*fin)*cos(uSwim - TAU*s - .7*fin); }
vec2 fishRest(vec2 uv, float asp){
  float A = abs(asp), L = (FUT - FUH)*A;
  // 1) undo the spine bend: each cross-section stays perpendicular to the bent spine
  float X = uv.x*A, x = X, dv = uv.y - FV0;
  for (int i=0;i<3;i++){ float s = clamp((x/A - FUH)/(FUT - FUH), 0., 1.);
    float g = fBendD(s)/L, c = inversesqrt(1. + g*g);
    dv = (uv.y - FV0 - fBend(s))/c; x = X + dv*g*c; }
  // 2) undo the foreshortening: walk from the head, each step projected by cos(yaw)
  float u1 = x/A, s1 = (u1 - FUH)/(FUT - FUH), sR = s1;
  if (s1 > 0. && s1 < 1.25) {
    float Pp = 0.; bool hit = false;
    for (int i=1;i<=28;i++){ float sa = float(i-1)/28.*1.3, sb = float(i)/28.*1.3;
      float st = cos(fYaw(min(.5*(sa + sb), 1.)))*(sb - sa);
      if (!hit && Pp + st >= s1) { sR = sa + (s1 - Pp)/st*(sb - sa); hit = true; }
      Pp += st; }
    if (!hit) sR = 2.;
  }
  vec2 r = vec2(FUH + sR*(FUT - FUH), FV0 + dv);
  // the pelvic fin gives a small paddle now and then
  vec2 piv = vec2(.452, .79);
  float wF = smoothstep(.40, .43, r.x)*smoothstep(.53, .50, r.x)*smoothstep(.76, .80, r.y);
  r = piv + (rot(uFFin*wF)*((r - piv)*vec2(A, 1.)))/vec2(A, 1.);
  return r;
}
vec2 uvToWorld(vec2 uv, vec4 xf, float asp){ return xf.xy + rot(xf.w)*vec2((uv.x - .5)*asp, uv.y - .5)*xf.z; }
void main(){
  vec2 p = P();
  vec2 w = W(p, 1.), wb = W(p, .3), ws = W(p, .5), wg = W(p, 1.15);
  // water: lighter under the surface, falling to dark below; the sea is deeper and darker than the river
  float depth = max(wb.y - SY, 0.);
  float water = mix(.46, .1, smoothstep(0., 1100. + 700.*uSea, depth)) * (1. - .3*uSea);
  water += (fbm(wb/vec2(500.,260.) + vec2(uT*.04, 0.)) - .5)*.08;
  vec3 col = vec3(water);
  // the surface seen from below: a bright, shivering band, and above it the underside mirror
  float sw = W(p, 1.).y;
  float rip = fbm(vec2(w.x/90. + uT*.6, uT*.4)) ;
  float surf = smoothstep(SY + 70., SY - 4., sw + (rip-.5)*24.);

function pineLayer(g, seed, baseY, amp, hMin, hMax, density, x0, x1, ground = true) {

    gl.uniform4f(prog.u.uTownR, anc[0] + 150 + drift, anc[1] + 15, 1450, 1450 * 1644 / 2560);
    gl.uniform4f(prog.u.uCityR, ...cityRect(t, cam));
    gl.uniform1f(prog.u.uSweep, lerp(fx + 520, fx - 520, ss(seg(t, 23.0, 25.0))));
    gl.uniform1f(prog.u.uSweepOn, seg(t, 22.9, 23.1));
    bindTex(prog, 'uMaskF', sf.t, 0); bindTex(prog, 'uMaskW', sw.t, 1); bindTex(prog, 'uTown', TX.town, 2); bindTex(prog, 'uCity', TX.city, 3);
    lightsU(prog, [], t);
  } else {
    const s = sil.whale, [x, y, h, a] = whaleXf(t);
    gl.uniform4f(prog.u.uSil, x, y, h * s.padH, a); gl.uniform1f(prog.u.uAsp, -s.asp);
    const ph = swimPhase(t);
    gl.uniform1f(prog.u.uWPh, ph); gl.uniform1f(prog.u.uWA, whaleAmp(t));
    gl.uniform1f(prog.u.uTail, .15 * Math.sin(ph - 3.6) * (1 - .7 * eo(seg(t, T_REG0, 42.0))));
    gl.uniform4f(prog.u.uCityR, ...cityRect(t, CAMS[4](t)));
    gl.uniform1f(prog.u.uSweep, lerp(200, 1800, ss(seg(t, 33.6, 35.2))));
    gl.uniform1f(prog.u.uSweepOn, seg(t, 33.5, 33.7)); gl.uniform1f(prog.u.uLitAll, ss(seg(t, 34.0, 35.2)));
    gl.uniform1f(prog.u.uReg, ss(seg(t, T_REG0, T_REG1)));
    gl.uniform1f(prog.u.uShore, ss(seg(t, T_REG1 - .6, T_DIS0 + .8)));
    gl.uniform1f(prog.u.uDis, .64 * ss(seg(t, T_DIS0, T_DIS1)));
    gl.uniform1f(prog.u.uRim, Math.min(seg(t, T_DIS0, T_DIS0 + .4), 1 - .5 * ss(seg(t, T_DIS1 - .4, T_DIS1 + 1.2))));
    const camR = cam3(T_REG0), hzS = screenOf(960, 770, 1.15, camR)[1];
    const cw = 2250, ch = cw * 1707 / 2560;
    gl.uniform4f(prog.u.uCityS, 900, hzS - .01 * ch, cw, ch);

}
function sceneAt(t) { return t < T_AB1 ? 0 : t < T_WHIP ? 1 : t < T_X1 ? 2 : t < T_SW1 ? 3 : 4; }
window.render = function (t) {
  t = clamp(+t || 0, 0, DUR);
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  for (const p of [P0, P1, P2, P3, P4, PC]) { const l = gl.getAttribLocation(p.p, 'a'); if (l >= 0) { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); } }
  const sA = sceneAt(t);
  drawScene(sA, t, FA);
  let mixv = 0, scr = 0;
  if (t >= T_AB0 && t < T_AB1) { drawScene(1, t, FB); mixv = ss(seg(t, T_AB0, T_AB1)); scr = 0; }
  if (t >= T_X0 && t < T_X1) { drawScene(3, t, FB); mixv = seg(t, T_X0, T_X1); scr = .55; }
  const split = t >= T_SW0 && t < T_SW1;
  if (split) drawScene(4, t, FB);
  // motion blur from the camera's screen velocity (whips, the breach) + radial blur for the push and the dive
  const dt = 1 / 60, cf = CAMS[sA], c0 = cf(Math.max(0, t - dt)), c1 = cf(Math.min(DUR, t + dt));
  let bx = -(c1[0] - c0[0]) * c0[2] * SC * .4, by = (c1[1] - c0[1]) * c0[2] * SC * .4;
  if (sA === 0) { bx = 0; by = 0; }
  if (Math.abs(by) > 600 * SC) by = Math.sign(by) * 600 * SC;
  let radial = 0;
  if (sA === 0) radial = Math.min(.03, Math.abs(Math.log(c1[2] / c0[2])) * .6);
  if (sA === 2) radial = .1 * Math.sin(Math.PI * seg(t, 20.65, 21.6));
  const flash = 0;
  const wsB = whaleScreenAny(T_BR), sprayAge = t - T_BR;
  const drop = screenOf(960, 600, 1, cam3(t))[1] - screenOf(960, 600, 1, cam3(T_BR))[1];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  drawSubs(t);
  gl.useProgram(PC.p);
  gl.uniform2f(PC.u.uRes, W, H); gl.uniform1f(PC.u.uT, t); gl.uniform1f(PC.u.uMix, mixv); gl.uniform1f(PC.u.uScr, scr);
  gl.uniform3f(PC.u.uBlurA, bx, by, radial); gl.uniform1f(PC.u.uFlash, flash);
  gl.uniform1f(PC.u.uSplitOn, split ? 1 : 0);
  gl.uniform4f(PC.u.uSplit, split ? surfY(t) : -100, whaleScreenAny(t)[0] + 120, 75 * Math.exp(-Math.pow((t - T_BR) / .22, 2)), ss(seg(t, T_SW0, T_SW0 + .4)));
  gl.uniform4f(PC.u.uSpray, wsB[0] + 60, surfY(T_BR) - 20, sprayAge, sprayAge > -0.05 && sprayAge < 2.2 ? 1 : 0);
  gl.uniform1f(PC.u.uSprayDrop, drop);
  gl.uniform1f(PC.u.uZoom, 1 + .035 * eio(seg(t, T_DIS1 - .4, DUR)));
  gl.uniform1f(PC.u.uTitleA, ss(seg(t, T_TITLE, T_TITLE + .7))); gl.uniform1f(PC.u.uTitleBlur, lerp(9, 0, eo(seg(t, T_TITLE, T_TITLE + .9))) * SC);
  gl.uniform1f(PC.u.uCredA, ss(seg(t, T_CRED, T_CRED + .7))); gl.uniform1f(PC.u.uCredBlur, lerp(7, 0, eo(seg(t, T_CRED, T_CRED + .9))) * SC);
  bindTex(PC, 'uA', FA.t, 0); bindTex(PC, 'uB', FB.t, 1); bindTex(PC, 'uTitle', TX.title, 2); bindTex(PC, 'uSub', subTex, 3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
};
window.DUR = DUR;
window.SUBS = SUBS;
window.TEXTS = t => {
  const out = [];
  if (t >= T_TITLE + .7) out.push({ id: 'title', text: '山海', x0: 1590 * SC, y0: 380 * SC, x1: 1746 * SC, y1: 690 * SC });
  if (t >= T_CRED + .7) {
    out.push({ id: 'film', text: 'Mountains and Seas', x0: 120 * SC, y0: 95 * SC, x1: 660 * SC, y1: 165 * SC });
    out.push({ id: 'style', text: 'Double Exposure 双重曝光', x0: 120 * SC, y0: 180 * SC, x1: 460 * SC, y1: 225 * SC });
    out.push({ id: 'credit', text: 'LemoLab × Claude Opus 5.5', x0: 120 * SC, y0: 268 * SC, x1: 560 * SC, y1: 310 * SC });
  }
  return out;
};

(async () => {
  const fonts = [new FontFace(FONT_ZH, 'url(fonts/NotoSerifSC-600-film.ttf)', { weight: '600' }),

  TX.forest = tex(forest); TX.mount = tex(mount); TX.city = tex(city); TX.waves = tex(waves); TX.town = tex(town);
  TX.pine = tex(pineTexture());
  [sil.stag, sil.wolf, sil.eagle, sil.salmon, sil.whale] = await Promise.all([
    maskTexture('assets/stag.svg', 2400), maskTexture('assets/wolf.svg', 2600), maskTexture('assets/eagle.svg', 3000),
    maskTexture('assets/salmon.svg', 2600, true), maskTexture('assets/humpback.svg', 3000, true)]);
  TX.title = titleTexture();
  P0 = program(FS0); P1 = program(FS1); P2 = program(FS2); P3 = program(FS3); P4 = program(FS4); PC = program(FSC);
  FA = fbo(); FB = fbo();
  window.render(0); window.READY = true;
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e); throw e; });
